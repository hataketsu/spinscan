<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COLMAP Rig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{"three":"/static/vendor/three.module.js"}}
</script>
<style>
:root{
  --ground:#0B0F14;
  --panel:#141A22;
  --panel-2:#1B232D;
  --line:#26303C;
  --ink:#E8EDF3;
  --ink-dim:#8A97A6;
  --amber:#FFB449;   /* capture domain: photos, coverage */
  --blue:#5B7FFF;    /* compute domain: GPU, pipeline */
  --red:#FF5C4D;     /* failure only */
  --r:14px;
}
*{box-sizing:border-box}
/* An author `display:flex` outranks the UA sheet's [hidden]{display:none}, so
   .opts panels marked hidden (#adv, #maskBox) stayed on screen. Make the
   attribute win everywhere instead of patching it one selector at a time. */
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--ground);color:var(--ink);
  font-family:"Be Vietnam Pro",system-ui,sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

/* ---------- chrome ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(11,15,20,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:14px 18px calc(14px + env(safe-area-inset-top)) 18px;
  padding-top:calc(14px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px;
}
.wordmark{font-weight:800;letter-spacing:-.03em;font-size:19px}
.wordmark span{color:var(--amber)}
.rig{
  margin-left:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-dim);display:flex;align-items:center;gap:7px;
}
.rig::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);
  box-shadow:0 0 0 3px rgba(91,127,255,.18)}
main{padding:20px 18px 40px;max-width:760px;margin:0 auto}

/* ---------- orbit gauge: one tick per photo around the object ---------- */
.gauge{display:block;flex:none}
.gauge .track{stroke:var(--line)}
.gauge .tick{stroke:var(--amber);stroke-linecap:round}
.gauge .mark{stroke:var(--ink-dim);opacity:.55}
.gauge .count{font-family:"Be Vietnam Pro",sans-serif;font-weight:800;fill:var(--ink);
  letter-spacing:-.04em;text-anchor:middle}
.gauge .unit{font-family:"IBM Plex Mono",monospace;fill:var(--ink-dim);text-anchor:middle;
  letter-spacing:.12em}
.gauge .sweep{stroke:var(--blue);stroke-linecap:round;opacity:0;transform-origin:50% 50%}
.is-running .gauge .sweep{opacity:1;animation:sweep 2.4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}

/* ---------- cards ---------- */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;display:flex;gap:16px;align-items:center;
  width:100%;text-align:left;margin-bottom:12px;
  transition:border-color .15s,transform .15s;
}
.card:hover{border-color:#33404F}
.card:active{transform:scale(.995)}
.card .meta{min-width:0;flex:1}
.card h3{margin:0 0 4px;font-size:17px;font-weight:700;letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{color:var(--ink-dim);font-size:13px}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:500;
  padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-dim);
}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.running{color:var(--blue);border-color:rgba(91,127,255,.35)}
.chip.running::before{animation:blink 1.1s ease-in-out infinite}
.chip.done{color:var(--blue);border-color:rgba(91,127,255,.35)}
.chip.failed{color:var(--red);border-color:rgba(255,92,77,.35)}
.chip.stopped{color:var(--ink-dim)}
@keyframes blink{50%{opacity:.25}}

/* ---------- actions ---------- */
.btn{
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  padding:12px 16px;border-radius:10px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{border-color:#3A4756}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--amber);color:#1A1206;border-color:var(--amber);font-weight:700}
.btn.compute{background:var(--blue);color:#0A0F26;border-color:var(--blue);font-weight:700}
.btn.danger{color:var(--red);border-color:rgba(255,92,77,.3);background:transparent}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:130px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- sections ---------- */
/* Section headings carry a hairline out to the right edge: it groups what
   follows without adding another boxed container to the stack. */
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);
  font-weight:500;margin:26px 0 10px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
main>h2:first-child{margin-top:2px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;
  text-align:center;color:var(--ink-dim);font-size:14px}
.hint{color:var(--ink-dim);font-size:13px;margin:8px 0 0}

/* ---------- detail: command bar ---------- */
/* Everything you need while a run is happening lives here and never scrolls
   away: name, status chip, stage/progress, and the one button that starts or
   stops the run. --hdr is the sticky site header's measured height. */
#dtop{position:sticky;top:var(--hdr,56px);z-index:15;background:var(--ground)}
.dhead{display:flex;align-items:center;gap:12px}
.dhead .id{flex:1;min-width:0}
.dhead h1{font-size:21px;font-weight:800;letter-spacing:-.03em;margin:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhead .btn{flex:none;padding:11px 14px}
.back{flex:none;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);
  border-radius:10px;padding:8px 12px;font-size:15px;line-height:1}
.back:hover{border-color:#3A4756;color:var(--ink)}

/* ---------- detail: tabs ---------- */
/* Scrolls sideways instead of wrapping to a second row on a narrow phone. */
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto;overscroll-behavior-x:contain;
  scrollbar-width:none;-ms-overflow-style:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;color:var(--ink-dim);
  padding:10px 12px 9px;font-size:14px;font-weight:500;white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--amber)}
.tabs .tb{font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:1.45;
  padding:1px 6px;border-radius:999px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--ink-dim)}
.tabs button.on .tb{color:var(--amber);border-color:rgba(255,180,73,.35)}

/* Every panel is built once and only toggled. The log, live-view and autotune
   pollers write into nodes that live inside panels the user is not looking at,
   so a hidden panel must still be a present panel. */
.panel[hidden]{display:none}
.panel>*:first-child{margin-top:14px}

/* Photo count + orbit gauge, moved off the header and into the Anh tab. */
.shots{display:flex;gap:16px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:16px}
.shots .meta{flex:1;min-width:0}
.shots .big{font-weight:700;font-size:16px;letter-spacing:-.02em}
.shots .hint{margin-top:4px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:12px}
.strip img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--panel-2)}
.more{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:7px;
  border:1px solid var(--line);color:var(--ink-dim);font-size:12px}

.opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.opt{flex:1 1 0;min-width:120px}
.opt label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-dim);margin-bottom:5px}
select,.opt input{width:100%;background:var(--panel-2);border:1px solid var(--line);
  border-radius:9px;padding:10px 11px;color:var(--ink);font:inherit}

.log{
  background:#080B10;border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-top:12px;max-height:340px;overflow:auto;
  font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.65;
  white-space:pre-wrap;word-break:break-word;color:#9FB0C2;
}
#log{max-height:min(64vh,620px)}
.log b{color:var(--amber);font-weight:500}
.log i{color:var(--red);font-style:normal}

.out{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;margin-bottom:8px;color:inherit}
.out:hover{border-color:#3A4756}
.out .hd{display:flex;align-items:baseline;gap:10px}
.out .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.out .sz{color:var(--ink-dim);font-size:12px;margin-left:auto;flex:none}
/* Actions wrap onto their own lines: on a phone the filename alone eats the
   width, and an unwrapped row pushed the download button off screen. */
.out .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.out .acts>*{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;
  padding:7px 12px;font-size:12px;color:var(--ink);text-decoration:none}
.out .acts>a{color:var(--amber)}
.out .acts>*:hover{border-color:#3A4756}

.md{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;margin-top:12px;font-size:14px;line-height:1.7}
.md h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);
  margin:16px 0 6px}
.md h3:first-child{margin-top:0}
.md ul{margin:6px 0 6px 18px}
.md li{margin-bottom:4px}
.md b{color:var(--ink)}
.md code{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--panel-2);
  padding:1px 5px;border-radius:5px}

.tick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-dim)}
.tick input{width:18px;height:18px;accent-color:var(--amber)}
#maskBox{display:flex;align-items:center;gap:12px;margin-top:10px}
#maskImg{width:96px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2)}
#maskInfo{font-size:12px;color:var(--ink-dim)}

#lightbox{position:fixed;inset:0;z-index:60;background:rgba(6,9,13,.94);display:none;
  flex-direction:column}
#lightbox.on{display:flex}
#lbImg{flex:1;min-height:0;object-fit:contain;width:100%}
#lbTop{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
#lbName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-dim)}
#lbBar{display:flex;gap:8px;justify-content:center;align-items:center;
  padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
#lbBar button{border:1px solid var(--line);background:var(--panel);border-radius:9px;
  padding:9px 16px;font-size:14px;color:var(--ink)}
#lbCount{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-dim);min-width:70px;
  text-align:center}

.strip button.more{border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);
  font-family:"IBM Plex Mono",monospace;font-size:12px;cursor:pointer}
.strip img{cursor:pointer}

#viewer{position:fixed;inset:0;z-index:50;background:var(--ground);display:none}
#viewer.on{display:block}
#viewer canvas{display:block;width:100%;height:100%;touch-action:none}
#vTop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:linear-gradient(var(--ground),rgba(11,15,20,0));pointer-events:none}
#vTop>*{pointer-events:auto}
#vName{font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:15px}
#vClose{margin-left:auto;border:1px solid var(--line);background:var(--panel);
  border-radius:9px;padding:8px 13px;font-size:13px}
#vBar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(11,15,20,0),var(--ground))}
#vBar button{border:1px solid var(--line);background:var(--panel);border-radius:9px;
  padding:9px 14px;font-size:13px}
#vBar button.on{border-color:var(--amber);color:var(--amber)}
#vInfo{position:absolute;top:50%;left:0;right:0;text-align:center;color:var(--ink-dim);
  font-size:13px;pointer-events:none}

#stage{margin-top:11px}
#stage .top{display:flex;align-items:baseline;gap:8px;font-size:13px}
#stage .step{color:var(--blue);font-weight:700;flex:none}
#stage .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stage .pct{margin-left:auto;font-size:12px;color:var(--ink-dim);flex:none}
#stage .track{height:4px;background:var(--panel-2);border-radius:2px;overflow:hidden;margin-top:7px}
#stage .track div{height:100%;background:var(--blue);border-radius:2px;transition:width .4s}
#stage .note{color:var(--ink-dim);font-size:12px;margin-top:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- live view from the phone ---------- */
#liveImg,#liveNone{width:100%;aspect-ratio:4/3;border-radius:var(--r);
  border:1px solid var(--line);margin-top:12px}
#liveImg{display:block;object-fit:contain;background:#06090D}
#liveNone{display:flex;align-items:center;justify-content:center;text-align:center;
  padding:24px;border-style:dashed;background:var(--panel);
  color:var(--ink-dim);font-size:13px;line-height:1.6}
#liveState{display:flex;align-items:center;gap:8px}
#liveState::before{content:"";width:7px;height:7px;border-radius:50%;
  background:var(--ink-dim);flex:none}
#liveState.on{color:var(--amber)}
#liveState.on::before{background:var(--amber);animation:blink 1.1s ease-in-out infinite}

.bar{height:3px;background:var(--panel-2);border-radius:2px;overflow:hidden;margin-top:12px}
.bar div{height:100%;background:var(--amber);width:0;transition:width .2s}

dialog{border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:var(--r);padding:20px;width:min(400px,92vw)}
dialog::backdrop{background:rgba(5,8,11,.7)}
dialog h3{margin:0 0 4px;font-size:18px;font-weight:700;letter-spacing:-.02em}
dialog input{width:100%;background:var(--panel-2);border:1px solid var(--line);
  border-radius:9px;padding:12px;margin:14px 0}
.err{color:var(--red);font-size:13px;min-height:19px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wordmark">COL<span>MAP</span> rig</div>
  <div class="rig mono">RTX 2080 Ti · CUDA</div>
</header>

<main id="app"></main>

<div id="lightbox">
  <div id="lbTop"><span id="lbName"></span><button id="lbClose">Đóng</button></div>
  <img id="lbImg" alt="">
  <div id="lbBar">
    <button id="lbPrev">←</button><span id="lbCount"></span><button id="lbNext">→</button>
  </div>
</div>

<div id="viewer">
  <div id="vTop"><div id="vName" class="mono"></div><button id="vClose">Đóng</button></div>
  <div id="vInfo">Đang tải…</div>
  <div id="vBar">
    <button id="vReset">Căn giữa</button>
    <button id="vColor" class="on">Màu ảnh</button>
    <button id="vSize">Điểm to</button>
    <button id="vFlip">Lật</button>
  </div>
</div>

<dialog id="dlg">
  <h3>Project mới</h3>
  <p class="hint" style="margin:0">Một project = một vật thể. Tên dùng chữ, số, dấu . _ -</p>
  <input id="dlgName" placeholder="vd: tuong-go" autocapitalize="off" autocorrect="off" spellcheck="false">
  <p class="err" id="dlgErr"></p>
  <div class="row">
    <button class="btn" id="dlgCancel">Huỷ</button>
    <button class="btn primary" id="dlgOk">Tạo project</button>
  </div>
</dialog>

<script type="module">
import { openViewer } from '/static/viewer.js';
const app = document.getElementById('app');
const RING_FULL = 150;   // photos that complete the orbit ring
const RING_MIN  = 40;    // fewest photos that reliably reconstruct
let view = {page:'list', name:null};
let logOffset = 0, poller = null;
// Which detail tab is showing, and for which project. A re-render of the same
// project (a poller finished, an upload landed, an STL got made) must leave the
// user on the tab they were reading; opening a DIFFERENT project starts over at
// the first tab, so a stale tab never carries across projects.
let tab = 'photos', tabFor = null;
// The command bar sticks below the site header, whose height depends on the
// safe-area inset, so measure it instead of guessing.
const syncHdr = () => document.documentElement.style.setProperty(
  '--hdr', document.querySelector('header').offsetHeight + 'px');
window.addEventListener('resize', syncHdr);
syncHdr();
// Module level for the same reason as the live timers: leaving the detail page
// has to be able to kill the autotune poll. A closure-local timer kept polling
// from a page nobody was on and then re-rendered the detail view over the top
// of whatever the user had navigated to.
let tuneTimer = null;
function stopTune(){ clearInterval(tuneTimer); tuneTimer = null; }

const api = async (path, opts={}) => {
  const r = await fetch('/api' + path, opts);
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
  return r.status === 204 ? null : r.json();
};
const jpost = (path, body) => api(path, {
  method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})
});
// Quotes included: filenames go straight into alt=""/title=""/data-view="",
// and an uploaded photo can legally be named   x" onload="...
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mb = n => n >= 1<<20 ? (n/(1<<20)).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB';
const STATUS = {idle:'Chưa chạy', running:'Đang dựng', done:'Xong', failed:'Lỗi', stopped:'Đã dừng'};

/* Stage strip: which of the six steps is running, and how far into it. */
function stageStrip(p){
  const g = p.progress, pct = g.total ? Math.round(g.done / g.total * 100) : null;
  const note = g.step === 5
    ? `Pass ${g.pass}/2 (${g.pass === 1 ? 'photometric' : 'geometric'}) · ${g.done}/${g.total} view · GPU`
    : (p.status === 'running' ? 'Đang chạy…' : '');
  return `<div id="stage">
    <div class="top"><span class="step mono">[${g.step}/6]</span>
      <span class="lbl">${esc(g.label)}</span>
      ${pct !== null ? `<span class="pct mono">${pct}%</span>` : ''}</div>
    ${pct !== null ? `<div class="track"><div style="width:${pct}%"></div></div>` : ''}
    ${note ? `<div class="note">${esc(note)}</div>` : ''}
  </div>`;
}

/* Orbit gauge — each tick is one photo placed around the object. */
function gauge(count, size=76){
  const c = size/2, r = c - 7, ticks = Math.min(count, RING_FULL);
  const at = (i, len) => {
    const a = (i / RING_FULL) * 2*Math.PI - Math.PI/2;
    const [x, y] = [Math.cos(a), Math.sin(a)];
    return `<line x1="${c+x*(r-len)}" y1="${c+y*(r-len)}" x2="${c+x*r}" y2="${c+y*r}"/>`;
  };
  let out = `<svg class="gauge" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle class="track" cx="${c}" cy="${c}" r="${r-3}" fill="none" stroke-width="1"/>
    <g class="mark" stroke-width="1.5">${at(RING_MIN, 8)}${at(RING_FULL, 8)}</g>
    <g class="tick" stroke-width="${size>100?2.2:1.8}">`;
  for (let i = 0; i < ticks; i++) out += at(i, 6);
  out += `</g>
    <g class="sweep" stroke-width="2.5">${at(0, 7)}</g>
    <text class="count" x="${c}" y="${c+2}" font-size="${size*.28}">${count}</text>
    <text class="unit" x="${c}" y="${c+size*.19}" font-size="${size*.11}">ẢNH</text>
  </svg>`;
  return out;
}

/* ---------------- list ---------------- */
async function renderList(){
  const ps = await api('/projects');
  app.innerHTML = `
    <h2>Project</h2>
    ${ps.length ? ps.map(p => `
      <button class="card ${p.status==='running'?'is-running':''}" data-open="${esc(p.name)}">
        ${gauge(p.images)}
        <div class="meta">
          <h3>${esc(p.name)}</h3>
          <div class="sub">${p.outputs.length ? p.outputs.length + ' file kết quả' : 'Chưa có kết quả'}</div>
          <div style="margin-top:8px"><span class="chip ${p.status}">${STATUS[p.status]}</span></div>
        </div>
      </button>`).join('')
    : `<div class="empty">Chưa có project nào.<br>Tạo một project rồi tải ảnh chụp quanh vật thể lên.</div>`}
    <div style="margin-top:16px"><button class="btn primary wide" id="new">+ Tạo project</button></div>
    <p class="hint">Chụp 40–150 ảnh vòng quanh vật thể, mỗi ảnh chồng lấn ảnh kế ~70%. Di chuyển máy ảnh, đừng xoay vật thể.</p>

    <h2>App Android</h2>
    <div class="out" id="apkCard">
      <div class="hd"><span class="nm mono">collmap.apk</span><span class="sz mono" id="apkVer">…</span></div>
      <div class="acts"><a class="mono" href="/api/app/download">Tải APK</a></div>
    </div>
    <p class="hint">Chụp theo hẹn giờ cho bàn xoay, khoá AE/AF/WB cả loạt, gửi thẳng
      từng ảnh về máy chủ. Cài lần đầu bằng link trên; các bản sau cập nhật ngay trong app.</p>`;
  document.getElementById('new').onclick = openDialog;
  // The APK card stays even when no build exists yet; only its subtitle changes.
  api('/app/latest')
    .then(v => document.getElementById('apkVer').textContent =
      'v' + v.version_name + ' · code ' + v.version_code + ' · ' + mb(v.size))
    .catch(() => document.getElementById('apkVer').textContent = 'chưa build');
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => go('detail', b.dataset.open));
}

/* ---------------- detail ---------------- */
async function renderDetail(name){
  const p = await api('/projects/' + encodeURIComponent(name));
  // A different project starts at the first tab; a re-render of the same one
  // (poller finished, upload landed, STL made) keeps the user where they were.
  if (tabFor !== name) { tab = 'photos'; tabFor = name; }
  const running = p.status === 'running';
  const TABS = [
    ['photos',   'Ảnh',       p.images],
    ['live',     'Trực tiếp', 0],
    ['build',    'Dựng',      0],
    ['out',      'Kết quả',   p.outputs.length],
    ['analysis', 'Phân tích', 0],
    ['log',      'Log',       0],
  ];
  if (!TABS.some(t => t[0] === tab)) tab = 'photos';
  // Every panel is emitted every render, visible or not: the pollers write into
  // #log, #liveImg, #tuneLog, #strip, #bar and the mask nodes by id and would
  // hit null the moment one of them lived only in the tab that happens to be on.
  const pan = (k, html) => `<section class="panel" role="tabpanel" data-panel="${k}"${
    k === tab ? '' : ' hidden'}>${html}</section>`;

  app.innerHTML = `
    <div id="dtop">
      <div class="dhead">
        <button class="back" aria-label="Tất cả project" title="Tất cả project">←</button>
        <div class="id">
          <h1>${esc(p.name)}</h1>
          <div style="margin-top:5px"><span class="chip ${p.status}">${STATUS[p.status]}</span></div>
        </div>
        ${running
          ? `<button class="btn danger" id="stop">Dừng</button>`
          : `<button class="btn compute" id="run" ${p.images < 3 ? 'disabled title="Cần ít nhất 3 ảnh"' : ''}>Chạy dựng hình</button>`}
      </div>
      ${p.progress ? stageStrip(p) : ''}
      <div class="tabs" role="tablist">${TABS.map(([k, label, n]) => `
        <button role="tab" data-tab="${k}" aria-selected="${k === tab ? 'true' : 'false'}"
          class="${k === tab ? 'on' : ''}">${esc(label)}${n ? `<span class="tb">${n}</span>` : ''}</button>`).join('')}
      </div>
    </div>

    ${pan('photos', `
      <div class="shots ${running ? 'is-running' : ''}">
        ${gauge(p.images, 96)}
        <div class="meta">
          <div class="big">${p.images} ảnh</div>
          <p class="hint">${p.images
            ? (p.images < RING_MIN
                ? 'Nên có ít nhất ' + RING_MIN + ' ảnh để dựng ổn định.'
                : 'Đủ để dựng hình.')
            : 'Chưa có ảnh nào. Chụp 40–150 ảnh vòng quanh vật thể, mỗi ảnh chồng lấn ảnh kế ~70%.'}</p>
          ${p.images ? `<button class="btn danger" id="clear"
            style="padding:5px 11px;font-size:12px;margin-top:9px">Xoá hết ảnh</button>` : ''}
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="pick">Chọn ảnh từ máy</button>
        <button class="btn" id="shoot">Chụp ảnh</button>
      </div>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <input id="cam"  type="file" accept="image/*" multiple capture="environment" hidden>
      <div class="bar" id="bar" hidden><div></div></div>
      <div id="strip" class="strip"></div>
      ${p.images > 24 ? `<p class="hint">Bấm một ảnh để xem to; +N mở hết ${p.images} ảnh.</p>` : ''}`)}

    ${pan('live', `
      <img id="liveImg" alt="Hình trực tiếp từ điện thoại" hidden>
      <div id="liveNone">Chưa có hình từ điện thoại.<br>Mở app trên điện thoại,
        chọn project này rồi bấm Chụp để bắt đầu gửi hình.</div>
      <p class="hint" id="liveState">Đang kiểm tra…</p>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" data-cmd="shoot" disabled>Chụp một ảnh</button>
        <button class="btn" data-cmd="start" disabled>Chạy tự động</button>
        <button class="btn danger" data-cmd="stop" disabled>Dừng</button>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn" data-cmd="lock" disabled>Khoá AE/AF</button>
        <button class="btn" data-cmd="unlock" disabled>Mở khoá</button>
      </div>
      <p class="hint">Lệnh nằm chờ trên máy chủ đến khi điện thoại lấy về, thường
        dưới một giây. Khoá AE/AF giữ nguyên phơi sáng và nét cho cả loạt ảnh.</p>`)}

    ${pan('build', `
      <div class="opts">
        <div class="opt"><label for="preset">Chế độ</label>
          <select id="preset">
            <option value="fast" selected>Nhanh — khung hình, ~7 phút</option>
            <option value="normal">Chi tiết — bề mặt nét, ~100 phút</option>
          </select></div>
        <div class="opt"><label for="mesher">Lưới</label>
          <select id="mesher">
            <option value="poisson">Poisson — vật thể kín</option>
            <option value="delaunay">Delaunay — cảnh mở</option>
            <option value="both">Cả hai</option>
          </select></div>
      </div>
      <p class="hint" id="presetHint"></p>
      <div class="opts" id="adv" hidden>
        <div class="opt"><label for="matcher">Ghép cặp</label>
          <select id="matcher">
            <option value="exhaustive">Exhaustive — chụp rời, ≤200 ảnh</option>
            <option value="sequential">Sequential — chụp liên tục theo vòng</option>
          </select></div>
        <div class="opt"><label for="max">Độ phân giải dense</label>
          <select id="max">
            <option value="1200">1200 px — nhanh</option>
            <option value="2000" selected>2000 px — cân bằng</option>
            <option value="3200">3200 px — chi tiết, chậm</option>
          </select></div>
      </div>
      <p class="hint">Chọn xong bấm <b>Chạy dựng hình</b> ở thanh trên cùng; nút đó
        đổi thành <b>Dừng</b> trong lúc chạy và tiến trình hiện ngay bên dưới tên project.</p>

      <h2>Nền &amp; mask</h2>
      <div class="row">
        <button class="btn" id="mkMask">Tạo mask + cắt ảnh</button>
        <label class="tick"><input type="checkbox" id="useMask"> Dùng mask khi dựng</label>
      </div>
      <div id="maskBox" hidden>
        <img id="maskImg" alt="mask">
        <span class="mono" id="maskInfo"></span>
      </div>
      <p class="hint">Chỉ dành cho rig máy ảnh đứng yên. Vùng nào đổi qua các khung
        chính là vùng đang xoay, nên một mask dùng chung cho cả bộ — không phải vẽ tay.
        Nền tĩnh nói với COLMAP rằng máy ảnh không hề di chuyển, mask cắt tiếng nói đó đi.</p>`)}

    ${pan('out', `
      ${p.outputs.length ? p.outputs.map(o => `
        <div class="out">
          <div class="hd"><span class="nm mono">${esc(o.name)}</span>
            <span class="sz mono">${mb(o.size)}</span></div>
          <div class="acts">
            <button data-view="${esc(o.name)}">Xem 3D</button>
            ${o.kind === 'mesh' ? `<button data-stl="${esc(o.name)}">→ STL</button>` : ''}
            <a class="mono" href="/api/projects/${encodeURIComponent(name)}/download/${encodeURIComponent(o.name)}">Tải về</a>
          </div>
        </div>`).join('')
      : `<div class="empty">Chưa có file kết quả.<br>Chạy dựng hình để tạo point cloud và mesh.</div>`}
      ${p.depth_maps ? `<div class="row" style="margin-top:12px">
          <button class="btn" id="preview">Xem trước bản dở (${p.depth_maps} depth map)</button>
        </div>
        <p class="hint">Ghép các depth map đã xong thành point cloud xem được ngay,
          không làm gián đoạn lượt chạy.</p>` : ''}

      <h2>Tối ưu STL tự động</h2>
      <div class="opts">
        <div class="opt"><label for="scaleTo">Cạnh dài nhất (mm)</label>
          <input id="scaleTo" inputmode="decimal" placeholder="để trống = giữ nguyên tỉ lệ">
        </div>
        <div class="opt"><label for="tgtFaces">Giảm mặt còn</label>
          <select id="tgtFaces">
            <option value="0">Giữ nguyên</option>
            <option value="200000">200k mặt</option>
            <option value="80000">80k mặt</option>
            <option value="30000">30k mặt</option>
          </select></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn compute" id="tune">Quét tham số + chấm mesh</button>
      </div>
      <p class="hint">Dựng lại Poisson ở nhiều độ sâu, bóc nền, vá kín, làm mượt, rồi
        chấm từng ứng viên theo sai lệch so với đám mây điểm. LLM xem ảnh render của
        3 ứng viên đầu để bắt lỗi mà số liệu không thấy. ~4 phút.</p>
      <div class="md" id="tuneOut" hidden></div>
      <div class="log mono" id="tuneLog" hidden></div>`)}

    ${pan('analysis', `
      <div class="row"><button class="btn" id="analyze" ${p.images < 3 ? 'disabled' : ''}>
        Chấm ảnh + gợi ý cải thiện</button></div>
      <p class="hint">Đo nét/phơi sáng từng ảnh, đo độ phủ góc máy quanh vật, rồi hỏi LLM
        nên sửa gì. Ảnh mẫu được gửi tới gateway LLM khai trong .env.</p>
      <div class="md" id="analysis" hidden></div>`)}

    ${pan('log', `<div class="log mono" id="log">Chưa có log.</div>`)}`;

  app.querySelector('.back').onclick = () => go('list');
  syncHdr();

  // Tabs. Switching only flips `hidden` on panels that all stay in the DOM, so
  // no timer is stopped, started or restarted here: the log keeps accumulating
  // and a running sweep keeps polling while the user reads another tab.
  const tabBar = app.querySelector('.tabs');
  const tabBtns = [...tabBar.querySelectorAll('[data-tab]')];
  const panels = [...app.querySelectorAll('[data-panel]')];
  // Nudge the sideways-scrolling bar only when the chosen tab is off its edge;
  // scrollIntoView would drag the whole page around instead.
  const keepInView = b => {
    const l = b.offsetLeft, r = l + b.offsetWidth;
    if (l < tabBar.scrollLeft + 8) tabBar.scrollLeft = l - 8;
    else if (r > tabBar.scrollLeft + tabBar.clientWidth - 8)
      tabBar.scrollLeft = r - tabBar.clientWidth + 8;
  };
  const setTab = k => {
    tab = k;
    tabBtns.forEach(b => {
      const on = b.dataset.tab === k;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    panels.forEach(s => { s.hidden = s.dataset.panel !== k; });
  };
  tabBtns.forEach(b => b.onclick = () => { setTab(b.dataset.tab); keepInView(b); });
  const activeTab = tabBtns.find(b => b.dataset.tab === tab);
  if (activeTab) keepInView(activeTab);
  const file = document.getElementById('file'), cam = document.getElementById('cam');
  document.getElementById('pick').onclick = () => file.click();
  document.getElementById('shoot').onclick = () => cam.click();
  file.onchange = cam.onchange = e => upload(name, e.target.files);

  const clear = document.getElementById('clear');
  if (clear) clear.onclick = async () => {
    if (!confirm('Xoá toàn bộ ảnh của project này?')) return;
    await api('/projects/' + encodeURIComponent(name) + '/images', {method:'DELETE'});
    renderDetail(name);
  };

  // Enough markdown for the shape the prompt asks for: headings, bullets,
  // bold, inline code. Anything else falls through as plain text.
  const md = t => esc(t)
    .replace(/^#{1,3} (.+)$/gm, '<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/(?:^[-*\d][.)]? ?.*(?:\n|$))+/gm,
             m => '<ul>' + m.trim().split('\n')
                    .map(l => '<li>' + l.replace(/^[-*\d]+[.)]? ?/, '') + '</li>')
                    .join('') + '</ul>')
    .replace(/\n{2,}/g, '<br><br>');

  const box = document.getElementById('analysis');
  const showAnalysis = t => { box.innerHTML = md(t); box.hidden = !t; };
  api('/projects/' + encodeURIComponent(name) + '/analysis')
    .then(r => showAnalysis(r.text)).catch(() => {});

  const az = document.getElementById('analyze');
  if (az) az.onclick = async () => {
    const had = !box.hidden;
    az.disabled = true; az.textContent = 'Đang phân tích…';
    try {
      const r = await jpost('/projects/' + encodeURIComponent(name) + '/analyze',
                            {refresh: had});
      showAnalysis(r.text);
    } catch (e) { alert(e.message); }
    az.disabled = false; az.textContent = 'Chấm lại';
  };

  const tuneBtn = document.getElementById('tune');
  const tuneLog = document.getElementById('tuneLog'), tuneOut = document.getElementById('tuneOut');
  stopTune();   // this render replaced the nodes the old poll was writing into

  const tuneReport = r => {
    if (!r) return '';
    const m = r.best.metrics, p = r.best.params;
    const rows = [
      ['File', r.output],
      ['Mặt', m.faces.toLocaleString('vi-VN')],
      ['Kín (in được)', m.watertight ? 'có' : 'KHÔNG'],
      ['Sai lệch RMS', m.drift_rms_pct.toFixed(2) + '% cỡ vật'],
      ['Phủ đám mây', (m.coverage * 100).toFixed(1) + '%'],
      ['Lỗ xuyên bị lấp', m.tunnels_lost > 0 ? m.tunnels_lost + ' — giảm bớt mức giảm mặt' : 'không'],
      ['Poisson', 'depth ' + p.poisson_depth + ', trim ' + p.poisson_trim],
      ['Vá / mượt', p.repair + ' / ' + p.smooth_iters],
    ];
    return '<h3>Kết quả tối ưu</h3>'
      + rows.map(([k, v]) => `<div><b>${k}:</b> ${esc(String(v))}</div>`).join('')
      + (r.critic ? `<h3>Nhận xét của LLM</h3>${esc(r.critic.why || '')}`
          + (r.critic.problems || []).map(x => `<li>${esc(x)}</li>`).join('') : '');
  };

  const pollTune = async () => {
    try {
      const r = await api('/projects/' + encodeURIComponent(name) + '/autotune');
      tuneLog.hidden = !r.log;
      if (r.log) { tuneLog.textContent = r.log; tuneLog.scrollTop = tuneLog.scrollHeight; }
      if (r.report) { tuneOut.innerHTML = tuneReport(r.report); tuneOut.hidden = false; }
      if (r.running && tuneTimer === null) {
        // A sweep survives a re-render and a reload; the button and the poll
        // have to find their way back to it.
        tuneBtn.disabled = true; tuneBtn.textContent = 'Đang quét…';
        tuneTimer = setInterval(pollTune, 3000);
      }
      if (!r.running) {
        // Only a run that was actually being watched has anything new to show.
        // Re-rendering on every poll made the first poll of every render redraw
        // the page, which started another poll -- an endless redraw loop that
        // reloaded the thumbnails out from under whoever was looking at them.
        const wasPolling = tuneTimer !== null;
        stopTune();
        if (wasPolling) {
          tuneBtn.disabled = false; tuneBtn.textContent = 'Quét lại';
          renderDetail(name);   // auto-best.stl is a new output row
        }
      }
    } catch (e) { stopTune(); }
  };

  if (tuneBtn) tuneBtn.onclick = async () => {
    tuneBtn.disabled = true; tuneBtn.textContent = 'Đang quét…';
    try {
      await jpost('/projects/' + encodeURIComponent(name) + '/autotune', {
        scale_to: parseFloat(document.getElementById('scaleTo').value) || 0,
        target_faces: +document.getElementById('tgtFaces').value,
      });
      tuneTimer = setInterval(pollTune, 3000);
      pollTune();
    } catch (e) { alert(e.message); tuneBtn.disabled = false; tuneBtn.textContent = 'Quét tham số + chấm mesh'; }
  };
  pollTune();

  const mkMask = document.getElementById('mkMask'), useMask = document.getElementById('useMask');
  const maskBox = document.getElementById('maskBox'), maskImg = document.getElementById('maskImg');
  const maskInfo = document.getElementById('maskInfo');
  const showMask = (m) => {
    maskBox.hidden = !m.has_mask;
    if (!m.has_mask) { useMask.checked = false; useMask.disabled = true; return; }
    useMask.disabled = false;
    // Cache-busted: a rebuilt mask keeps the same URL.
    maskImg.src = `/api/projects/${encodeURIComponent(name)}/mask/preview?t=${Date.now()}`;
    maskInfo.textContent = m.has_crop ? 'có mask + ảnh đã cắt' : 'có mask (chưa cắt ảnh)';
  };
  api('/projects/' + encodeURIComponent(name) + '/mask').then(showMask).catch(() => {});

  if (mkMask) mkMask.onclick = async () => {
    const label = mkMask.textContent;
    mkMask.disabled = true; mkMask.textContent = 'Đang dò vùng xoay…';
    try {
      const r = await jpost('/projects/' + encodeURIComponent(name) + '/mask', {crop: true});
      const m = await api('/projects/' + encodeURIComponent(name) + '/mask');
      showMask(m);
      useMask.checked = true;
      alert(r.log || 'Xong');
    } catch (e) { alert(e.message); }
    mkMask.disabled = false; mkMask.textContent = label;
  };

  const preset = document.getElementById('preset'), adv = document.getElementById('adv');
  const presetHint = document.getElementById('presetHint');
  const syncPreset = () => {
    const fast = preset.value === 'fast';
    adv.hidden = fast;   // fast picks its own matcher and resolution; showing
                         // stale selects would suggest they still apply
    presetHint.textContent = fast
      ? 'Dense 700 px, bỏ pass geometric. Ra đúng khối và biến dạng, mất chi tiết bề mặt.'
      : 'Dense 2000 px, có pass geometric. Bề mặt nét, gấp ~15 lần thời gian.';
  };
  preset.onchange = syncPreset;
  syncPreset();

  const run = document.getElementById('run');
  if (run) run.onclick = async () => {
    run.disabled = true;
    try {
      await jpost('/projects/' + encodeURIComponent(name) + '/run', {
        preset: document.getElementById('preset').value,
        use_mask: document.getElementById('useMask').checked,
        matcher: document.getElementById('matcher').value,
        max_size: +document.getElementById('max').value,
        mesher: document.getElementById('mesher').value,
      });
      logOffset = 0;
      renderDetail(name);
    } catch (e) { alert(e.message); run.disabled = false; }
  };
  const stop = document.getElementById('stop');
  if (stop) stop.onclick = async () => {
    if (!confirm('Dừng pipeline? Kết quả dở dang sẽ mất.')) return;
    await jpost('/projects/' + encodeURIComponent(name) + '/stop');
    renderDetail(name);
  };

  // Contact strip of everything uploaded so far.
  if (p.images){
    const strip = document.getElementById('strip');
    const base = '/api/projects/' + encodeURIComponent(name) + '/image/';
    const CAP = 24;
    let shots = [];
    const drawStrip = (all) => {
      const list = all ? shots : shots.slice(0, CAP);
      strip.innerHTML = list.map((n, i) =>
        `<img loading="lazy" data-i="${i}" src="${base}${encodeURIComponent(n)}" alt="${esc(n)}" title="${esc(n)}">`
      ).join('') + (!all && shots.length > CAP
        ? `<button class="more mono" id="moreShots">+${shots.length - CAP}</button>` : '');
      const more = document.getElementById('moreShots');
      if (more) more.onclick = () => drawStrip(true);
      strip.querySelectorAll('img').forEach(img =>
        img.onclick = () => openShot(+img.dataset.i));
    };
    // Thumbnails are the full-size JPEGs, so the browser only fetches what it
    // scrolls to -- that is what makes showing all of them affordable.
    const openShot = (i) => showLightbox(shots, i, base);
    api('/projects/' + encodeURIComponent(name) + '/images').then(names => {
      shots = names;
      drawStrip(false);
    });
  }

  const prev = document.getElementById('preview');
  if (prev) prev.onclick = async () => {
    const label = prev.textContent;
    prev.disabled = true; prev.textContent = 'Đang ghép… (1–2 phút)';
    try {
      const r = await jpost(`/projects/${encodeURIComponent(name)}/preview`);
      renderDetail(name);
      alert(r.log || ('Đã tạo ' + r.name));
    } catch (e) { alert(e.message); prev.disabled = false; prev.textContent = label; }
  };

  app.querySelectorAll('[data-view]').forEach(b => b.onclick = () =>
    openViewer(name, b.dataset.view));
  app.querySelectorAll('[data-stl]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = 'Đang chuyển…';
    try {
      const r = await jpost(`/projects/${encodeURIComponent(name)}/stl/${encodeURIComponent(b.dataset.stl)}`);
      renderDetail(name);
      alert(r.log || ('Đã tạo ' + r.name));
    } catch (e) { alert(e.message); b.disabled = false; b.textContent = '→ STL'; }
  });

  startLive(name);
  logOffset = 0;
  pollLog(name);
}

function pollLog(name){
  clearInterval(poller);
  const el = () => document.getElementById('log');
  // Re-render when the run ENDS, and only then. Re-rendering whenever a poll
  // comes back "not running" would fire on the first poll of a page whose
  // pipeline finished long ago -- and that render starts another poll, which
  // renders again: an endless redraw. Same guard as pollTune's wasPolling.
  let sawRunning = false;
  const tick = async () => {
    if (view.page !== 'detail' || view.name !== name) return clearInterval(poller);
    const box = el(); if (!box) return clearInterval(poller);
    let r;
    // A blip (server restart, wifi drop) must not reject out of the tick and
    // leave the interval firing into nothing; skip this round and try again.
    try { r = await api(`/projects/${encodeURIComponent(name)}/log?offset=${logOffset}`); }
    catch (e) { return; }
    if (logOffset === 0 && r.text) box.innerHTML = '';
    if (r.text){
      const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
      box.innerHTML += esc(r.text)
        .replace(/^(==&gt; .*)$/gm, '<b>$1</b>')
        .replace(/^(ERROR.*)$/gm, '<i>$1</i>');
      logOffset = r.offset;
      if (stick) box.scrollTop = box.scrollHeight;
    }
    if (r.status === 'running') { sawRunning = true; return; }
    clearInterval(poller);
    // The run just ended under us: the status chip, the stage strip and the
    // whole Kết quả section are all stale now.
    if (sawRunning) renderDetail(name);
  };
  tick();
  poller = setInterval(tick, 2000);
}

/* ---------------- live view ---------------- */
/* The phone pushes preview frames to the server and long-polls for commands;
   this half only refreshes an <img> and drops commands in the mailbox.
   Both timers are module-level for one reason: go() must be able to kill them
   the same way it kills the log poller, or leaving the page leaves an interval
   hammering the server forever. */
let liveTimer = null, liveStatusTimer = null;

function stopLive(){
  clearInterval(liveTimer); liveTimer = null;
  clearInterval(liveStatusTimer); liveStatusTimer = null;
}

function startLive(name){
  stopLive();   // every renderDetail() rebuilds this section; never stack timers
  const img = document.getElementById('liveImg');
  const none = document.getElementById('liveNone');
  const state = document.getElementById('liveState');
  if (!img) return;
  const url = '/api/projects/' + encodeURIComponent(name) + '/live';
  const btns = [...app.querySelectorAll('[data-cmd]')];
  const dark = () => { img.hidden = true; none.hidden = false; };

  const frame = () => {
    if (view.page !== 'detail' || view.name !== name) return stopLive();
    // Load into a detached Image first: swapping src straight into the visible
    // <img> would flash it to a broken-image icon the moment a frame 404s.
    const next = new Image();
    next.onload = () => { img.src = next.src; img.hidden = false; none.hidden = true; };
    next.onerror = dark;
    next.src = url + '.jpg?t=' + Date.now();
  };

  const status = async () => {
    if (view.page !== 'detail' || view.name !== name) return stopLive();
    let alive = false;
    try { alive = (await api('/projects/' + encodeURIComponent(name) + '/live/status')).alive; }
    catch (e) { alive = false; }
    state.className = 'hint' + (alive ? ' on' : '');
    state.textContent = alive
      ? 'Điện thoại đang gửi hình'
      : 'Chưa có tín hiệu từ điện thoại — mở app, vào project này rồi bấm Chụp';
    // Sending a command nothing will collect is just a lie to the user.
    btns.forEach(b => b.disabled = !alive);
    if (!alive) dark();
  };

  btns.forEach(b => b.onclick = async () => {
    const label = b.textContent;
    b.disabled = true; b.textContent = 'Đã gửi';
    try { await jpost('/projects/' + encodeURIComponent(name) + '/command', {cmd: b.dataset.cmd}); }
    catch (e) { alert(e.message); }
    setTimeout(() => { b.textContent = label; status(); }, 700);
  });

  frame(); status();
  liveTimer = setInterval(frame, 400);
  liveStatusTimer = setInterval(status, 1500);
}

/* ---------------- lightbox ---------------- */
/* Full-size review of one shot: the strip's thumbnails are too small to judge
   focus or framing, which is the whole reason for looking at them. */
const lb = {
  el: document.getElementById('lightbox'),
  img: document.getElementById('lbImg'),
  name: document.getElementById('lbName'),
  count: document.getElementById('lbCount'),
  list: [], i: 0, base: '',
};

function showLightbox(list, i, base){
  lb.list = list; lb.base = base;
  lbGo(i);
  lb.el.classList.add('on');
}

function lbGo(i){
  if (!lb.list.length) return;
  lb.i = (i + lb.list.length) % lb.list.length;
  const n = lb.list[lb.i];
  lb.img.src = lb.base + encodeURIComponent(n);
  lb.name.textContent = n;
  lb.count.textContent = (lb.i + 1) + ' / ' + lb.list.length;
}

document.getElementById('lbClose').onclick = () => lb.el.classList.remove('on');
document.getElementById('lbPrev').onclick = () => lbGo(lb.i - 1);
document.getElementById('lbNext').onclick = () => lbGo(lb.i + 1);
lb.img.onclick = () => lbGo(lb.i + 1);
window.addEventListener('keydown', e => {
  if (!lb.el.classList.contains('on')) return;
  if (e.key === 'Escape') lb.el.classList.remove('on');
  if (e.key === 'ArrowLeft') lbGo(lb.i - 1);
  if (e.key === 'ArrowRight') lbGo(lb.i + 1);
});

/* ---------------- upload ---------------- */
function upload(name, files){
  if (!files || !files.length) return;
  const bar = document.getElementById('bar'), fill = bar.firstElementChild;
  bar.hidden = false;
  const fd = new FormData();
  for (const f of files) fd.append('files', f, f.name);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/projects/' + encodeURIComponent(name) + '/images');
  xhr.upload.onprogress = e => { if (e.lengthComputable) fill.style.width = (e.loaded/e.total*100)+'%'; };
  xhr.onload = () => {
    bar.hidden = true; fill.style.width = '0';
    if (xhr.status >= 400) return alert('Tải ảnh thất bại: ' + xhr.statusText);
    renderDetail(name);
  };
  xhr.onerror = () => { bar.hidden = true; alert('Mất kết nối khi tải ảnh.'); };
  xhr.send(fd);
}

/* ---------------- dialog ---------------- */
const dlg = document.getElementById('dlg');
function openDialog(){
  document.getElementById('dlgName').value = '';
  document.getElementById('dlgErr').textContent = '';
  dlg.showModal();
  setTimeout(() => document.getElementById('dlgName').focus(), 50);
}
document.getElementById('dlgCancel').onclick = () => dlg.close();
document.getElementById('dlgOk').onclick = async () => {
  const name = document.getElementById('dlgName').value.trim();
  try { await jpost('/projects', {name}); dlg.close(); go('detail', name); }
  catch (e) { document.getElementById('dlgErr').textContent = e.message; }
};
document.getElementById('dlgName').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('dlgOk').click();
});

/* ---------------- routing ---------------- */
function go(page, name){
  clearInterval(poller);
  stopLive();
  stopTune();
  view = {page, name};
  location.hash = page === 'detail' ? '#/' + encodeURIComponent(name) : '';
  render();
}
function render(){
  (view.page === 'detail' ? renderDetail(view.name) : renderList())
    .catch(e => { app.innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
}
window.addEventListener('hashchange', () => {
  clearInterval(poller);
  stopLive();
  stopTune();
  const h = location.hash.replace(/^#\/?/, '');
  view = h ? {page:'detail', name:decodeURIComponent(h)} : {page:'list', name:null};
  render();
});
const h0 = location.hash.replace(/^#\/?/, '');
if (h0) view = {page:'detail', name:decodeURIComponent(h0)};
render();
</script>
