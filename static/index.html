<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COLMAP Rig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{"three":"/static/vendor/three.module.js"}}

<style>
/* =========================================================================
   Material 3, dark, amber. The colour values below are the SAME NUMBERS the
   Android app carries in res/values/colors.xml -- not a palette re-derived
   from a seed, because a tonal palette generated from #FFB449 does not land
   on these and the two halves would drift apart. Moving between the phone
   and the browser must not read as two products.

   Everything new is expressed in the M3 role tokens. The old --panel /
   --amber / --r names survive as aliases underneath so nothing that still
   references them breaks.
   ========================================================================= */
:root{
  /* --- colour roles --- */
  --md-primary:#FFB449;
  --md-on-primary:#452B00;
  --md-primary-container:#633F00;
  --md-on-primary-container:#FFDDB3;

  --md-secondary:#5B7FFF;           /* compute domain: GPU, pipeline */
  --md-on-secondary:#001A43;
  --md-secondary-container:#2B4899;
  --md-on-secondary-container:#DCE1FF;

  --md-error:#FF5C4D;               /* failure only */
  --md-on-error:#40000A;
  --md-error-container:#93000F;
  --md-on-error-container:#FFDAD5;

  --md-surface:#0B0F14;
  --md-surface-container-lowest:#070A0E;
  --md-surface-container-low:#141A22;
  --md-surface-container:#1B232D;
  --md-surface-container-high:#222C38;
  --md-surface-container-highest:#2A3441;
  --md-on-surface:#E6EDF5;
  --md-on-surface-variant:#8496A8;

  --md-outline:#2A3441;
  --md-outline-variant:#1B232D;
  --md-scrim:rgba(0,0,0,.62);
  /* The two scrims the app floats its control strips over, same values. */
  --md-scrim-strip:rgba(11,15,20,.8);
  --md-scrim-viewer:rgba(11,15,20,.94);
  --md-inverse-surface:#E6EDF5;     /* snackbar: light on dark, as M3 does */
  --md-inverse-on-surface:#141A22;
  --md-inverse-primary:#7A5300;

  /* --- shape scale (identical to the app's) --- */
  --md-shape-xs:4px;
  --md-shape-sm:8px;
  --md-shape-md:12px;
  --md-shape-lg:16px;
  --md-shape-xl:28px;
  --md-shape-full:999px;

  /* --- type scale. Be Vietnam Pro for prose, IBM Plex Mono for data.
         Line heights run a touch taller than the M3 defaults: Vietnamese
         stacks two diacritics above a glyph and 20/14 clips them. --- */
  --md-display-small:700 34px/1.2 "Be Vietnam Pro",system-ui,sans-serif;
  --md-headline-medium:700 28px/1.25 "Be Vietnam Pro",system-ui,sans-serif;
  --md-headline-small:700 24px/1.3 "Be Vietnam Pro",system-ui,sans-serif;
  --md-title-large:600 22px/1.35 "Be Vietnam Pro",system-ui,sans-serif;
  --md-title-medium:600 16px/1.4 "Be Vietnam Pro",system-ui,sans-serif;
  --md-body-large:400 16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;
  --md-body-medium:400 14px/1.55 "Be Vietnam Pro",system-ui,sans-serif;
  --md-body-small:400 12px/1.5 "Be Vietnam Pro",system-ui,sans-serif;
  --md-label-large:500 14px/1.45 "Be Vietnam Pro",system-ui,sans-serif;
  --md-label-medium:500 12px/1.35 "Be Vietnam Pro",system-ui,sans-serif;
  --md-label-small:500 11px/1.45 "Be Vietnam Pro",system-ui,sans-serif;

  /* --- motion --- */
  --md-ease:cubic-bezier(.2,0,0,1);
  --md-ease-out:cubic-bezier(0,0,0,1);

  /* --- elevation. Tonal first: a raised surface is a LIGHTER container.
         Real shadows are kept for the few things that genuinely float --
         a scrolled app bar, the dialog, the snackbar. --- */
  --md-elev-1:0 1px 2px rgba(0,0,0,.42),0 1px 3px 1px rgba(0,0,0,.24);
  --md-elev-2:0 1px 2px rgba(0,0,0,.42),0 2px 6px 2px rgba(0,0,0,.24);
  --md-elev-3:0 1px 3px rgba(0,0,0,.42),0 4px 8px 3px rgba(0,0,0,.24);

  /* --- aliases kept so older rules and any stray reference still resolve --- */
  --ground:var(--md-surface);
  --panel:var(--md-surface-container-low);
  --panel-2:var(--md-surface-container);
  --line:var(--md-outline);
  --ink:var(--md-on-surface);
  --ink-dim:var(--md-on-surface-variant);
  --amber:var(--md-primary);
  --blue:var(--md-secondary);
  --red:var(--md-error);
  --r:var(--md-shape-lg);
}
*{box-sizing:border-box}
/* An author `display:flex` outranks the UA sheet's [hidden]{display:none}, so
   .opts panels marked hidden (#adv, #maskBox) stayed on screen. Make the
   attribute win everywhere instead of patching it one selector at a time. */
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--md-surface);color:var(--md-on-surface);
  font:var(--md-body-medium);
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
:focus-visible{outline:2px solid var(--md-primary);outline-offset:2px}

/* ---------- state layer + ripple ----------
   Every interactive surface carries an M3 state layer: an overlay of the
   role's "on" colour at 8% hovered, 12% pressed. --state is that colour, so
   a filled amber button darkens with on-primary while a card lightens with
   on-surface. :where() keeps all of this at zero specificity -- a component
   rule further down can override any of it without !important. */
:where(.btn,.card,.tab,.back,.out .acts>*,.strip .more,.bnav-item,
       #lbClose,#lbPrev,#lbNext,#lbBar button,#vClose,#vBar button,.snackbar button){
  position:relative;overflow:hidden;
  --state:var(--md-on-surface);
  -webkit-tap-highlight-color:transparent;
}
:where(.btn,.card,.tab,.back,.out .acts>*,.strip .more,.bnav-item,
       #lbClose,#lbPrev,#lbNext,#lbBar button,#vClose,#vBar button,.snackbar button)::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:var(--state);opacity:0;pointer-events:none;
  transition:opacity .1s linear;
}
:where(.btn,.card,.tab,.back,.out .acts>*,.strip .more,.bnav-item,
       #lbClose,#lbPrev,#lbNext,#lbBar button,#vClose,#vBar button,.snackbar button):hover::after{opacity:.08}
:where(.btn,.card,.tab,.back,.out .acts>*,.strip .more,.bnav-item,
       #lbClose,#lbPrev,#lbNext,#lbBar button,#vClose,#vBar button,.snackbar button):active::after{opacity:.12}
:where(button:disabled)::after{opacity:0!important}

.ripple{
  position:absolute;border-radius:50%;pointer-events:none;
  background:var(--state,var(--md-on-surface));opacity:.12;
  transform:scale(0);animation:ripple .45s var(--md-ease-out) forwards;
}
@keyframes ripple{to{transform:scale(1);opacity:0}}

/* ---------- top app bar ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:var(--md-surface);
  padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px;
  transition:background .2s var(--md-ease),box-shadow .2s var(--md-ease);
}
/* Only once the page has actually scrolled does the bar leave the page:
   lighter container plus a real shadow, exactly like the app's toolbar. */
body.scrolled header{background:var(--md-surface-container);box-shadow:var(--md-elev-2)}
.wordmark{font:var(--md-title-large);letter-spacing:-.02em}
.wordmark span{color:var(--md-primary)}
.rig{
  margin-left:auto;font:var(--md-label-small);letter-spacing:.08em;text-transform:uppercase;
  color:var(--md-on-surface-variant);display:flex;align-items:center;gap:7px;
}
.rig::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--md-secondary);
  box-shadow:0 0 0 3px rgba(91,127,255,.18)}
main{padding:20px 18px 40px;max-width:760px;margin:0 auto}

/* ---------- orbit gauge: one tick per photo around the object ---------- */
.gauge{display:block;flex:none}
.gauge .track{stroke:var(--md-outline)}
.gauge .tick{stroke:var(--md-primary);stroke-linecap:round}
.gauge .mark{stroke:var(--md-on-surface-variant);opacity:.55}
.gauge .count{font-family:"Be Vietnam Pro",sans-serif;font-weight:700;fill:var(--md-on-surface);
  letter-spacing:-.04em;text-anchor:middle}
.gauge .unit{font-family:"IBM Plex Mono",monospace;fill:var(--md-on-surface-variant);text-anchor:middle;
  letter-spacing:.12em}
.gauge .sweep{stroke:var(--md-secondary);stroke-linecap:round;opacity:0;transform-origin:50% 50%}
.is-running .gauge .sweep{opacity:1;animation:sweep 2.4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}

/* ---------- cards ----------
   Filled card: surface-container-low, hairline outline-variant, corner large,
   no shadow. A card is not floating, it is a lighter patch of the surface. */
.card{
  background:var(--md-surface-container-low);border:1px solid var(--md-outline-variant);
  border-radius:var(--md-shape-lg);
  padding:16px;display:flex;gap:16px;align-items:center;
  width:100%;text-align:left;margin-bottom:12px;color:var(--md-on-surface);
  transition:background .15s var(--md-ease),border-color .15s var(--md-ease);
}
.card:hover{border-color:var(--md-outline);background:var(--md-surface-container)}
.card .meta{min-width:0;flex:1}
.card h3{margin:0 0 4px;font:var(--md-title-medium);letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{color:var(--md-on-surface-variant);font:var(--md-body-small)}

/* ---------- chips (M3 assist chip) ---------- */
.chip{
  display:inline-flex;align-items:center;gap:7px;height:32px;
  font:var(--md-label-large);
  padding:0 12px;border-radius:var(--md-shape-sm);
  border:1px solid var(--md-outline);color:var(--md-on-surface-variant);
  background:transparent;
}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.chip.running{color:var(--md-primary);border-color:rgba(255,180,73,.4);background:rgba(255,180,73,.08)}
.chip.running::before{animation:blink 1.1s ease-in-out infinite}
.chip.done{color:var(--md-secondary);border-color:rgba(91,127,255,.4);background:rgba(91,127,255,.08)}
.chip.failed{color:var(--md-error);border-color:rgba(255,92,77,.4);background:rgba(255,92,77,.08)}
.chip.stopped,.chip.idle{color:var(--md-on-surface-variant)}
@keyframes blink{50%{opacity:.25}}

/* ---------- buttons ----------
   The five M3 emphases. .btn on its own is the tonal-neutral default;
   .primary/.filled is the one high-emphasis action on a screen. */
.btn{
  border:1px solid transparent;background:var(--md-surface-container-highest);
  color:var(--md-on-surface);
  min-height:40px;padding:9px 20px;border-radius:var(--md-shape-full);
  font:var(--md-label-large);letter-spacing:.01em;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s var(--md-ease),border-color .15s var(--md-ease),opacity .15s;
}
.btn:disabled{opacity:.38;cursor:not-allowed}
/* filled */
.btn.primary,.btn.filled{background:var(--md-primary);color:var(--md-on-primary);
  border-color:transparent;font-weight:600;--state:var(--md-on-primary)}
/* filled, compute domain */
.btn.compute{background:var(--md-secondary);color:var(--md-on-secondary);
  border-color:transparent;font-weight:600;--state:var(--md-on-secondary)}
/* filled tonal */
.btn.tonal{background:var(--md-primary-container);color:var(--md-on-primary-container);
  --state:var(--md-on-primary-container)}
.btn.tonal.compute{background:var(--md-secondary-container);color:var(--md-on-secondary-container);
  --state:var(--md-on-secondary-container)}
/* outlined */
.btn.outlined{background:transparent;border-color:var(--md-outline);color:var(--md-primary);
  --state:var(--md-primary)}
.btn.outlined:hover{border-color:var(--md-on-surface-variant)}
/* text */
.btn.text{background:transparent;border-color:transparent;color:var(--md-primary);
  padding:9px 12px;--state:var(--md-primary)}
/* error, outlined or text */
.btn.danger{background:transparent;color:var(--md-error);border-color:rgba(255,92,77,.4);
  --state:var(--md-error)}
.btn.text.danger{border-color:transparent}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:130px}

/* ---------- sections ---------- */
/* Section headings carry a hairline out to the right edge: it groups what
   follows without adding another boxed container to the stack. */
h2{font:var(--md-title-large);letter-spacing:-.01em;color:var(--md-on-surface);
  margin:30px 0 12px;display:flex;align-items:center;gap:14px}
h2::after{content:"";flex:1;height:1px;background:var(--md-outline-variant)}
main>h2:first-child{margin-top:2px}
.empty{border:1px dashed var(--md-outline);border-radius:var(--md-shape-lg);padding:32px 20px;
  text-align:center;color:var(--md-on-surface-variant);font:var(--md-body-medium)}
.hint{color:var(--md-on-surface-variant);font:var(--md-body-small);margin:8px 0 0}

/* ---------- detail: command bar ---------- */
/* Everything you need while a run is happening lives here and never scrolls
   away: name, status chip, stage/progress, and the one button that starts or
   stops the run. --hdr is the sticky site header's measured height. */
#dtop{
  position:sticky;top:var(--hdr,56px);z-index:15;
  background:var(--md-surface);
  margin:0 -18px;padding:0 18px 2px;
  transition:background .2s var(--md-ease),box-shadow .2s var(--md-ease);
}
body.scrolled #dtop{background:var(--md-surface-container-high);box-shadow:var(--md-elev-2)}
.dhead{display:flex;align-items:center;gap:12px;padding-top:4px}
.dhead .id{flex:1;min-width:0}
.dhead h1{font:var(--md-headline-small);font-size:clamp(21px,5.6vw,28px);letter-spacing:-.02em;margin:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhead .btn{flex:none;padding:9px 16px}
.back{
  flex:none;border:0;background:transparent;color:var(--md-on-surface-variant);
  border-radius:var(--md-shape-full);width:40px;height:40px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:20px;line-height:1;margin-left:-6px;
}
.back:hover{color:var(--md-on-surface)}

/* ---------- detail: tabs (M3 primary tabs) ----------
   Scrolls sideways instead of wrapping to a second row on a narrow phone.
   The active marker is ONE element that slides, not a border on each tab. */
.tabs{position:relative;display:flex;gap:2px;margin-top:14px;
  overflow-x:auto;overscroll-behavior-x:contain;
  scrollbar-width:none;-ms-overflow-style:none;
  border-bottom:1px solid var(--md-outline-variant)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;color:var(--md-on-surface-variant);
  padding:14px 16px 13px;font:var(--md-label-large);white-space:nowrap;
  border-radius:var(--md-shape-sm) var(--md-shape-sm) 0 0;
  display:inline-flex;align-items:center;gap:7px;
  transition:color .15s var(--md-ease)}
.tabs button:hover{color:var(--md-on-surface)}
.tabs button.on{color:var(--md-primary);--state:var(--md-primary)}
.tabind{
  position:absolute;left:0;bottom:0;height:3px;width:0;
  background:var(--md-primary);border-radius:3px 3px 0 0;pointer-events:none;
}
.tabs.ready .tabind{transition:transform .25s var(--md-ease),width .25s var(--md-ease)}
.tabs .tb{font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:1.45;
  padding:1px 7px;border-radius:var(--md-shape-full);background:var(--md-surface-container-high);
  color:var(--md-on-surface-variant)}
.tabs button.on .tb{background:var(--md-primary-container);color:var(--md-on-primary-container)}

/* Every panel is built once and only toggled. The log, live-view and autotune
   pollers write into nodes that live inside panels the user is not looking at,
   so a hidden panel must still be a present panel. */
.panel[hidden]{display:none}
.panel>*:first-child{margin-top:16px}

/* Photo count + orbit gauge, moved off the header and into the Anh tab. */
.shots{display:flex;gap:16px;align-items:center;background:var(--md-surface-container-low);
  border:1px solid var(--md-outline-variant);border-radius:var(--md-shape-lg);padding:16px}
.shots .meta{flex:1;min-width:0}
.shots .big{font:var(--md-title-medium);letter-spacing:-.01em}
.shots .hint{margin-top:4px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:14px}
.strip img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--md-shape-sm);
  border:1px solid var(--md-outline-variant);background:var(--md-surface-container)}
.more{display:flex;align-items:center;justify-content:center;aspect-ratio:1;
  border-radius:var(--md-shape-sm);border:1px solid var(--md-outline);
  color:var(--md-on-surface-variant);font-size:12px}

/* ---------- outlined text fields, with the label notching the outline ---- */
.opts{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.opt{flex:1 1 0;min-width:150px;position:relative}
.opt label{position:absolute;top:0;left:10px;transform:translateY(-50%);z-index:1;
  background:var(--md-surface);padding:0 5px;pointer-events:none;
  font:var(--md-label-small);letter-spacing:.02em;color:var(--md-on-surface-variant)}
select,.opt input{
  width:100%;background:transparent;color:var(--md-on-surface);
  border:1px solid var(--md-outline);border-radius:var(--md-shape-xs);
  padding:15px 12px;font:var(--md-body-medium);
  -webkit-appearance:none;appearance:none;
  transition:border-color .15s var(--md-ease),box-shadow .15s var(--md-ease);
}
select{
  padding-right:38px;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='%238496A8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:20px;
}
select option{background:var(--md-surface-container-high);color:var(--md-on-surface)}
select:hover,.opt input:hover{border-color:var(--md-on-surface-variant)}
select:focus,.opt input:focus{outline:none;border-color:var(--md-primary);
  box-shadow:inset 0 0 0 1px var(--md-primary)}
.opt:focus-within label{color:var(--md-primary)}
.opt input::placeholder{color:var(--md-on-surface-variant);opacity:.7}

/* ---------- switch (M3), driven by the real checkbox ----------
   The <input> stays the source of truth -- .checked reads still work, it is
   still focusable and still toggles with the keyboard; it is just invisible
   on top of the track it draws. Scoped to label.tick so it cannot reach the
   <g class="tick"> inside the orbit gauge. */
label.tick{display:inline-flex;align-items:center;gap:12px;position:relative;
  font:var(--md-body-medium);color:var(--md-on-surface);cursor:pointer;min-height:40px;padding:0 2px}
label.tick input{position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:52px;height:32px;margin:0;opacity:0;cursor:pointer;z-index:1}
.sw{flex:none;width:52px;height:32px;border-radius:var(--md-shape-full);
  border:2px solid var(--md-outline);background:var(--md-surface-container-highest);
  position:relative;transition:background .2s var(--md-ease),border-color .2s var(--md-ease)}
.sw::after{content:"";position:absolute;top:50%;left:6px;width:16px;height:16px;border-radius:50%;
  background:var(--md-on-surface-variant);transform:translateY(-50%);
  transition:transform .2s var(--md-ease),width .2s var(--md-ease),
             height .2s var(--md-ease),left .2s var(--md-ease),background .2s var(--md-ease)}
label.tick input:checked+.sw{background:var(--md-primary);border-color:var(--md-primary)}
label.tick input:checked+.sw::after{left:4px;width:24px;height:24px;
  background:var(--md-on-primary);transform:translate(20px,-50%)}
label.tick input:disabled+.sw{opacity:.38}
label.tick input:disabled~.lb{opacity:.38}
label.tick input:focus-visible+.sw{outline:2px solid var(--md-primary);outline-offset:3px}

/* ---------- log ---------- */
.log{
  background:var(--md-surface-container-lowest);border:1px solid var(--md-outline-variant);
  border-radius:var(--md-shape-md);
  padding:14px;margin-top:14px;max-height:340px;overflow:auto;
  font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.65;
  white-space:pre-wrap;word-break:break-word;color:#9FB0C2;
}
#log{max-height:min(64vh,620px)}
.log b{color:var(--md-primary);font-weight:500}
.log i{color:var(--md-error);font-style:normal}

/* ---------- result rows ---------- */
.out{background:var(--md-surface-container-low);border:1px solid var(--md-outline-variant);
  border-radius:var(--md-shape-md);padding:14px;margin-bottom:8px;color:inherit}
.out .hd{display:flex;align-items:baseline;gap:10px}
.out .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.out .sz{color:var(--md-on-surface-variant);font-size:12px;margin-left:auto;flex:none}
/* Actions wrap onto their own lines: on a phone the filename alone eats the
   width, and an unwrapped row pushed the download button off screen. */
.out .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.out .acts>*{border:1px solid var(--md-outline);background:transparent;
  border-radius:var(--md-shape-full);min-height:32px;padding:5px 16px;
  font:var(--md-label-medium);color:var(--md-on-surface);text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;
  transition:border-color .15s var(--md-ease)}
.out .acts>a{color:var(--md-primary);--state:var(--md-primary)}
.out .acts>*:hover{border-color:var(--md-on-surface-variant)}

/* ---------- markdown blocks ---------- */
.md{background:var(--md-surface-container-low);border:1px solid var(--md-outline-variant);
  border-radius:var(--md-shape-md);
  padding:16px;margin-top:14px;font:var(--md-body-medium);line-height:1.7}
.md h3{font:var(--md-title-medium);color:var(--md-primary);margin:18px 0 6px}
.md h3:first-child{margin-top:0}
.md ul{margin:6px 0 6px 18px}
.md li{margin-bottom:4px}
.md b{color:var(--md-on-surface)}
.md code{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--md-surface-container-high);
  padding:1px 5px;border-radius:var(--md-shape-xs)}

/* ---------- mask preview ---------- */
#maskBox{display:flex;align-items:center;gap:12px;margin-top:12px}
#maskImg{width:96px;border-radius:var(--md-shape-sm);border:1px solid var(--md-outline-variant);
  background:var(--md-surface-container)}
#maskInfo{font-size:12px;color:var(--md-on-surface-variant)}

/* ---------- lightbox ----------
   Full-size review of one shot. The scrim is near-black, so everything on it
   is drawn with the on-surface roles -- #lbClose used to carry no rule at all
   and fell back to the UA's light-grey system button on a black scrim. */
#lightbox{position:fixed;inset:0;z-index:60;background:var(--md-scrim-viewer);display:none;
  flex-direction:column;overflow:hidden;overscroll-behavior:contain}
#lightbox.on{display:flex}
#lbImg{flex:1;min-height:0;object-fit:contain;width:100%;
  touch-action:none;cursor:zoom-in;will-change:transform;user-select:none;-webkit-user-drag:none}
#lightbox.zoom #lbImg{cursor:grab}
#lightbox.zoom #lbImg:active{cursor:grabbing}
#lbTop{display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 12px 10px 16px}
#lbName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--md-on-surface-variant)}
#lbClose{
  flex:none;border:0;background:transparent;color:var(--md-on-surface);
  border-radius:var(--md-shape-full);min-height:40px;padding:9px 16px;
  font:var(--md-label-large);
}
#lbBar{display:flex;gap:10px;justify-content:center;align-items:center;
  padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
#lbBar button{border:0;background:var(--md-surface-container-high);color:var(--md-on-surface);
  border-radius:var(--md-shape-full);min-width:56px;min-height:40px;padding:9px 18px;
  font:var(--md-label-large)}
#lbCount{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--md-on-surface-variant);
  min-width:78px;text-align:center}

.strip button.more{border:1px solid var(--md-outline);background:var(--md-surface-container);
  color:var(--md-on-surface-variant);
  font-family:"IBM Plex Mono",monospace;font-size:12px;cursor:pointer}
.strip img{cursor:pointer}

/* ---------- 3D viewer ---------- */
#viewer{position:fixed;inset:0;z-index:50;background:var(--md-surface);display:none}
#viewer.on{display:block}
#viewer canvas{display:block;width:100%;height:100%;touch-action:none}
#vTop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:linear-gradient(var(--md-surface),rgba(11,15,20,0));pointer-events:none}
#vTop>*{pointer-events:auto}
#vName{font:var(--md-title-medium);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
#vClose{margin-left:auto;border:0;background:var(--md-surface-container-high);color:var(--md-on-surface);
  border-radius:var(--md-shape-full);min-height:40px;padding:9px 18px;font:var(--md-label-large)}
#vBar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;
  flex-wrap:wrap;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(11,15,20,0),var(--md-surface))}
#vBar button{border:1px solid var(--md-outline);background:var(--md-surface-container-low);
  color:var(--md-on-surface);border-radius:var(--md-shape-full);min-height:36px;
  padding:8px 16px;font:var(--md-label-medium)}
#vBar button.on{background:var(--md-primary-container);border-color:transparent;
  color:var(--md-on-primary-container);--state:var(--md-on-primary-container)}
#vInfo{position:absolute;top:50%;left:0;right:0;text-align:center;
  color:var(--md-on-surface-variant);font:var(--md-body-medium);pointer-events:none}

/* ---------- stage strip + progress (M3 linear indicator) ---------- */
#stage{margin-top:12px}
#stage .top{display:flex;align-items:baseline;gap:8px;font:var(--md-body-medium)}
#stage .step{color:var(--md-secondary);font-weight:700;flex:none}
#stage .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stage .pct{margin-left:auto;font-size:12px;color:var(--md-on-surface-variant);flex:none}
#stage .track{height:4px;background:var(--md-surface-container-highest);border-radius:var(--md-shape-full);
  overflow:hidden;margin-top:8px}
#stage .track div{height:100%;background:var(--md-secondary);border-radius:var(--md-shape-full);
  transition:width .4s var(--md-ease)}
#stage .note{color:var(--md-on-surface-variant);font-size:12px;margin-top:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- live view from the phone ---------- */
#liveImg,#liveNone{width:100%;aspect-ratio:4/3;border-radius:var(--md-shape-lg);
  border:1px solid var(--md-outline-variant);margin-top:14px}
#liveImg{display:block;object-fit:contain;background:var(--md-surface-container-lowest)}
#liveNone{display:flex;align-items:center;justify-content:center;text-align:center;
  padding:24px;border-style:dashed;border-color:var(--md-outline);
  background:var(--md-surface-container-low);
  color:var(--md-on-surface-variant);font:var(--md-body-medium)}
#liveState{display:flex;align-items:center;gap:8px}
#liveState::before{content:"";width:8px;height:8px;border-radius:50%;
  background:var(--md-on-surface-variant);flex:none}
#liveState.on{color:var(--md-primary)}
#liveState.on::before{background:var(--md-primary);animation:blink 1.1s ease-in-out infinite}

.bar{height:4px;background:var(--md-surface-container-highest);border-radius:var(--md-shape-full);
  overflow:hidden;margin-top:14px}
.bar div{height:100%;background:var(--md-primary);width:0;transition:width .2s}

/* ---------- dialog ---------- */
dialog{border:0;background:var(--md-surface-container-high);color:var(--md-on-surface);
  border-radius:var(--md-shape-xl);padding:24px;width:min(400px,92vw);box-shadow:var(--md-elev-3)}
dialog::backdrop{background:var(--md-scrim)}
dialog h3{margin:0 0 6px;font:var(--md-headline-small);font-size:22px;letter-spacing:-.01em}
dialog input{width:100%;background:transparent;color:var(--md-on-surface);
  border:1px solid var(--md-outline);border-radius:var(--md-shape-xs);
  padding:15px 12px;margin:18px 0 4px;font:var(--md-body-medium)}
dialog input:focus{outline:none;border-color:var(--md-primary);box-shadow:inset 0 0 0 1px var(--md-primary)}
dialog .row{margin-top:14px;justify-content:flex-end}
dialog .row>*{flex:0 0 auto;min-width:0}
.err{color:var(--md-error);font:var(--md-body-small);min-height:19px}

/* ---------- snackbar ----------
   Non-blocking replacement for alert(): a real decision still gets confirm(),
   but "it worked" / "it failed" no longer freezes the page. */
.snackbar{
  position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));
  transform:translate(-50%,140%);
  z-index:70;max-width:min(560px,calc(100vw - 32px));
  display:flex;align-items:center;gap:8px;
  background:var(--md-inverse-surface);color:var(--md-inverse-on-surface);
  border-radius:var(--md-shape-xs);box-shadow:var(--md-elev-3);
  padding:14px 12px 14px 16px;font:var(--md-body-medium);
  opacity:0;pointer-events:none;
  transition:transform .25s var(--md-ease),opacity .2s var(--md-ease);
}
.snackbar.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.snackbar .msg{flex:1;min-width:0;max-height:6em;overflow:auto;
  white-space:pre-wrap;word-break:break-word}
.snackbar button{flex:none;border:0;background:transparent;color:var(--md-inverse-primary);
  font:var(--md-label-large);padding:8px 12px;border-radius:var(--md-shape-full);
  --state:var(--md-inverse-on-surface)}

/* ---------- navigation bar (narrow screens only) ----------
   The phone app anchors on a bottom nav; the web gets the same anchor, with
   only the destinations that actually exist here. */
.bnav{display:none}
.bnav-item{
  flex:1 1 0;border:0;background:none;color:var(--md-on-surface-variant);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:0;border-radius:var(--md-shape-lg);font:var(--md-label-medium);
}
.bnav-item .ico{display:flex;align-items:center;justify-content:center;
  width:64px;height:32px;border-radius:var(--md-shape-full);
  transition:background .2s var(--md-ease),color .2s var(--md-ease)}
.bnav-item .ico svg{width:24px;height:24px;display:block}
.bnav-item.on{color:var(--md-on-surface)}
.bnav-item.on .ico{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.bnav-item[data-nav="detail"]{display:none}
@media (max-width:520px){
  /* Two fields side by side on a phone clip their own option text -- these
     labels are whole sentences. One per row, the way the app stacks them. */
  .opt{min-width:100%}
  .opts{gap:22px}
}
@media (max-width:700px){
  .bnav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:4px;
    background:var(--md-surface-container);border-top:1px solid var(--md-outline-variant);
    padding:12px 8px calc(16px + env(safe-area-inset-bottom));
  }
  body.has-detail .bnav-item[data-nav="detail"]{display:flex}
  /* Exactly the bar's height, so the last element of every panel clears it. */
  main{padding-bottom:calc(80px + 24px + env(safe-area-inset-bottom))}
  .snackbar{bottom:calc(96px + env(safe-area-inset-bottom))}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wordmark">COL<span>MAP</span> rig</div>
  <div class="rig mono">RTX 2080 Ti · CUDA</div>
</header>

<main id="app"></main>

<div id="lightbox">
  <div id="lbTop"><span id="lbName"></span><button id="lbClose">Đóng</button></div>
  <img id="lbImg" alt="">
  <div id="lbBar">
    <button id="lbPrev">←</button><span id="lbCount"></span><button id="lbNext">→</button>
  </div>
</div>

<div id="viewer">
  <div id="vTop"><div id="vName" class="mono"></div><button id="vClose">Đóng</button></div>
  <div id="vInfo">Đang tải…</div>
  <div id="vBar">
    <button id="vReset">Căn giữa</button>
    <button id="vColor" class="on">Màu ảnh</button>
    <button id="vSize">Điểm to</button>
    <button id="vFlip">Lật</button>
  </div>
</div>

<dialog id="dlg">
  <h3>Project mới</h3>
  <p class="hint" style="margin:0">Một project = một vật thể. Tên dùng chữ, số, dấu . _ -</p>
  <input id="dlgName" placeholder="vd: tuong-go" autocapitalize="off" autocorrect="off" spellcheck="false">
  <p class="err" id="dlgErr"></p>
  <div class="row">
    <button class="btn text" id="dlgCancel">Huỷ</button>
    <button class="btn primary" id="dlgOk">Tạo project</button>
  </div>
</dialog>

<!-- M3 navigation bar. Narrow screens only (the media query owns its
     display, so the `hidden` attribute is deliberately not used here: the
     global [hidden]{display:none!important} would win over the query).
     Only the destinations this front end actually has. -->
<nav class="bnav" id="bnav" aria-label="Điều hướng">
  <button class="bnav-item on" data-nav="list">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18"
      height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></svg></span>
    <span class="lb">Project</span>
  </button>
  <button class="bnav-item" data-nav="detail">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.6 21 7.5v9L12 21.4
      3 16.5v-9z"/><path d="M12 12.1 21 7.5M12 12.1v9.3M12 12.1 3 7.5"/></svg></span>
    <span class="lb">Chi tiết</span>
  </button>
</nav>

<div class="snackbar" id="snack" role="status" aria-live="polite">
  <span class="msg" id="snackMsg"></span>
  <button id="snackAct" type="button">Đóng</button>
</div>

<script type="module">
import { openViewer } from '/static/viewer.js';
const app = document.getElementById('app');
const RING_FULL = 150;   // photos that complete the orbit ring
const RING_MIN  = 40;    // fewest photos that reliably reconstruct
let view = {page:'list', name:null};
let logOffset = 0, poller = null;
// Which detail tab is showing, and for which project. A re-render of the same
// project (a poller finished, an upload landed, an STL got made) must leave the
// user on the tab they were reading; opening a DIFFERENT project starts over at
// the first tab, so a stale tab never carries across projects.
let tab = 'photos', tabFor = null;
// The command bar sticks below the site header, whose height depends on the
// safe-area inset, so measure it instead of guessing.
const syncHdr = () => document.documentElement.style.setProperty(
  '--hdr', document.querySelector('header').offsetHeight + 'px');
window.addEventListener('resize', syncHdr);
syncHdr();
// Module level for the same reason as the live timers: leaving the detail page
// has to be able to kill the autotune poll. A closure-local timer kept polling
// from a page nobody was on and then re-rendered the detail view over the top
// of whatever the user had navigated to.
let tuneTimer = null;
function stopTune(){ clearInterval(tuneTimer); tuneTimer = null; }

const api = async (path, opts={}) => {
  const r = await fetch('/api' + path, opts);
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
  return r.status === 204 ? null : r.json();
};
const jpost = (path, body) => api(path, {
  method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})
});
// Quotes included: filenames go straight into alt=""/title=""/data-view="",
// and an uploaded photo can legally be named   x" onload="...
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mb = n => n >= 1<<20 ? (n/(1<<20)).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB';
const STATUS = {idle:'Chưa chạy', running:'Đang dựng', done:'Xong', failed:'Lỗi', stopped:'Đã dừng'};

/* Stage strip: which of the six steps is running, and how far into it. */
function stageStrip(p){
  const g = p.progress, pct = g.total ? Math.round(g.done / g.total * 100) : null;
  const note = g.step === 5
    ? `Pass ${g.pass}/2 (${g.pass === 1 ? 'photometric' : 'geometric'}) · ${g.done}/${g.total} view · GPU`
    : (p.status === 'running' ? 'Đang chạy…' : '');
  return `<div id="stage">
    <div class="top"><span class="step mono">[${g.step}/6]</span>
      <span class="lbl">${esc(g.label)}</span>
      ${pct !== null ? `<span class="pct mono">${pct}%</span>` : ''}</div>
    ${pct !== null ? `<div class="track"><div style="width:${pct}%"></div></div>` : ''}
    ${note ? `<div class="note">${esc(note)}</div>` : ''}
  </div>`;
}

/* Orbit gauge — each tick is one photo placed around the object. */
function gauge(count, size=76){
  const c = size/2, r = c - 7, ticks = Math.min(count, RING_FULL);
  const at = (i, len) => {
    const a = (i / RING_FULL) * 2*Math.PI - Math.PI/2;
    const [x, y] = [Math.cos(a), Math.sin(a)];
    return `<line x1="${c+x*(r-len)}" y1="${c+y*(r-len)}" x2="${c+x*r}" y2="${c+y*r}"/>`;
  };
  let out = `<svg class="gauge" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle class="track" cx="${c}" cy="${c}" r="${r-3}" fill="none" stroke-width="1"/>
    <g class="mark" stroke-width="1.5">${at(RING_MIN, 8)}${at(RING_FULL, 8)}</g>
    <g class="tick" stroke-width="${size>100?2.2:1.8}">`;
  for (let i = 0; i < ticks; i++) out += at(i, 6);
  out += `</g>
    <g class="sweep" stroke-width="2.5">${at(0, 7)}</g>
    <text class="count" x="${c}" y="${c+2}" font-size="${size*.28}">${count}</text>
    <text class="unit" x="${c}" y="${c+size*.19}" font-size="${size*.11}">ẢNH</text>
  </svg>`;
  return out;
}

/* ---------------- list ---------------- */
async function renderList(){
  const ps = await api('/projects');
  app.innerHTML = `
    <h2>Project</h2>
    ${ps.length ? ps.map(p => `
      <button class="card ${p.status==='running'?'is-running':''}" data-open="${esc(p.name)}">
        ${gauge(p.images)}
        <div class="meta">
          <h3>${esc(p.name)}</h3>
          <div class="sub">${p.outputs.length ? p.outputs.length + ' file kết quả' : 'Chưa có kết quả'}</div>
          <div style="margin-top:8px"><span class="chip ${p.status}">${STATUS[p.status]}</span></div>
        </div>
      </button>`).join('')
    : `<div class="empty">Chưa có project nào.<br>Tạo một project rồi tải ảnh chụp quanh vật thể lên.</div>`}
    <div style="margin-top:16px"><button class="btn primary wide" id="new">+ Tạo project</button></div>
    <p class="hint">Chụp 40–150 ảnh vòng quanh vật thể, mỗi ảnh chồng lấn ảnh kế ~70%. Di chuyển máy ảnh, đừng xoay vật thể.</p>

    <h2>App Android</h2>
    <div class="out" id="apkCard">
      <div class="hd"><span class="nm mono">collmap.apk</span><span class="sz mono" id="apkVer">…</span></div>
      <div class="acts"><a class="mono" href="/api/app/download">Tải APK</a></div>
    </div>
    <p class="hint">Chụp theo hẹn giờ cho bàn xoay, khoá AE/AF/WB cả loạt, gửi thẳng
      từng ảnh về máy chủ. Cài lần đầu bằng link trên; các bản sau cập nhật ngay trong app.</p>`;
  document.getElementById('new').onclick = openDialog;
  // The APK card stays even when no build exists yet; only its subtitle changes.
  api('/app/latest')
    .then(v => document.getElementById('apkVer').textContent =
      'v' + v.version_name + ' · code ' + v.version_code + ' · ' + mb(v.size))
    .catch(() => document.getElementById('apkVer').textContent = 'chưa build');
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => go('detail', b.dataset.open));
}

/* ---------------- detail ---------------- */
async function renderDetail(name){
  const p = await api('/projects/' + encodeURIComponent(name));
  // A different project starts at the first tab; a re-render of the same one
  // (poller finished, upload landed, STL made) keeps the user where they were.
  if (tabFor !== name) { tab = 'photos'; tabFor = name; }
  const running = p.status === 'running';
  const TABS = [
    ['photos',   'Ảnh',       p.images],
    ['live',     'Trực tiếp', 0],
    ['build',    'Dựng',      0],
    ['out',      'Kết quả',   p.outputs.length],
    ['analysis', 'Phân tích', 0],
    ['log',      'Log',       0],
  ];
  if (!TABS.some(t => t[0] === tab)) tab = 'photos';
  // Every panel is emitted every render, visible or not: the pollers write into
  // #log, #liveImg, #tuneLog, #strip, #bar and the mask nodes by id and would
  // hit null the moment one of them lived only in the tab that happens to be on.
  const pan = (k, html) => `<section class="panel" role="tabpanel" data-panel="${k}"${
    k === tab ? '' : ' hidden'}>${html}</section>`;

  app.innerHTML = `
    <div id="dtop">
      <div class="dhead">
        <button class="back" aria-label="Tất cả project" title="Tất cả project">←</button>
        <div class="id">
          <h1>${esc(p.name)}</h1>
          <div style="margin-top:5px"><span class="chip ${p.status}">${STATUS[p.status]}</span></div>
        </div>
        ${running
          ? `<button class="btn danger" id="stop">Dừng</button>`
          : `<button class="btn primary" id="run" ${p.images < 3 ? 'disabled title="Cần ít nhất 3 ảnh"' : ''}>Chạy dựng hình</button>`}
      </div>
      ${p.progress ? stageStrip(p) : ''}
      <div class="tabs" role="tablist">${TABS.map(([k, label, n]) => `
        <button role="tab" class="tab ${k === tab ? 'on' : ''}" data-tab="${k}"
          aria-selected="${k === tab ? 'true' : 'false'}">${esc(label)}${
            n ? `<span class="tb">${n}</span>` : ''}</button>`).join('')}
        <span class="tabind" aria-hidden="true"></span>
      </div>
    </div>

    ${pan('photos', `
      <div class="shots ${running ? 'is-running' : ''}">
        ${gauge(p.images, 96)}
        <div class="meta">
          <div class="big">${p.images} ảnh</div>
          <p class="hint">${p.images
            ? (p.images < RING_MIN
                ? 'Nên có ít nhất ' + RING_MIN + ' ảnh để dựng ổn định.'
                : 'Đủ để dựng hình.')
            : 'Chưa có ảnh nào. Chụp 40–150 ảnh vòng quanh vật thể, mỗi ảnh chồng lấn ảnh kế ~70%.'}</p>
          ${p.images ? `<button class="btn text danger" id="clear"
            style="min-height:32px;padding:5px 12px;font-size:12px;margin-top:9px">Xoá hết ảnh</button>` : ''}
        </div>
      </div>
      <div class="row" style="margin-top:12px">

    ${pan('analysis', `

  app.querySelector('.back').onclick = () => go('list');

  // Tabs. Switching only flips `hidden` on panels that all stay in the DOM, so

  const tabBar = app.querySelector('.tabs');

function pollLog(name){
  clearInterval(poller);
  const el = () => document.getElementById('log');
  // Re-render when the run ENDS, and only then. Re-rendering whenever a poll
  // comes back "not running" would fire on the first poll of a page whose
  // pipeline finished long ago -- and that render starts another poll, which
  // renders again: an endless redraw. Same guard as pollTune's wasPolling.
  let sawRunning = false;
  const tick = async () => {
    if (view.page !== 'detail' || view.name !== name) return clearInterval(poller);
    const box = el(); if (!box) return clearInterval(poller);
    let r;
    // A blip (server restart, wifi drop) must not reject out of the tick and
    // leave the interval firing into nothing; skip this round and try again.
    try { r = await api(`/projects/${encodeURIComponent(name)}/log?offset=${logOffset}`); }
    catch (e) { return; }
    if (logOffset === 0 && r.text) box.innerHTML = '';
    if (r.text){
      const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
      box.innerHTML += esc(r.text)
        .replace(/^(==&gt; .*)$/gm, '<b>$1</b>')
        .replace(/^(ERROR.*)$/gm, '<i>$1</i>');
      logOffset = r.offset;
      if (stick) box.scrollTop = box.scrollHeight;
    }
    if (r.status === 'running') { sawRunning = true; return; }
    clearInterval(poller);
    // The run just ended under us: the status chip, the stage strip and the
    // whole Kết quả section are all stale now.
    if (sawRunning) renderDetail(name);
  };
  tick();
  poller = setInterval(tick, 2000);
}

/* ---------------- live view ---------------- */
/* The phone pushes preview frames to the server and long-polls for commands;
   this half only refreshes an <img> and drops commands in the mailbox.
   Both timers are module-level for one reason: go() must be able to kill them
   the same way it kills the log poller, or leaving the page leaves an interval
   hammering the server forever. */
let liveTimer = null, liveStatusTimer = null;

function stopLive(){
  clearInterval(liveTimer); liveTimer = null;
  clearInterval(liveStatusTimer); liveStatusTimer = null;
}

function startLive(name){
  stopLive();   // every renderDetail() rebuilds this section; never stack timers
  const img = document.getElementById('liveImg');
  const none = document.getElementById('liveNone');
  const state = document.getElementById('liveState');
  if (!img) return;
  const url = '/api/projects/' + encodeURIComponent(name) + '/live';
  const btns = [...app.querySelectorAll('[data-cmd]')];
  const dark = () => { img.hidden = true; none.hidden = false; };

  const frame = () => {
    if (view.page !== 'detail' || view.name !== name) return stopLive();
    // Load into a detached Image first: swapping src straight into the visible
    // <img> would flash it to a broken-image icon the moment a frame 404s.
    const next = new Image();
    next.onload = () => { img.src = next.src; img.hidden = false; none.hidden = true; };
    next.onerror = dark;
    next.src = url + '.jpg?t=' + Date.now();
  };

  const status = async () => {
    if (view.page !== 'detail' || view.name !== name) return stopLive();
    let alive = false;
    try { alive = (await api('/projects/' + encodeURIComponent(name) + '/live/status')).alive; }
    catch (e) { alive = false; }
    state.className = 'hint' + (alive ? ' on' : '');
    state.textContent = alive
      ? 'Điện thoại đang gửi hình'
      : 'Chưa có tín hiệu từ điện thoại — mở app, vào project này rồi bấm Chụp';
    // Sending a command nothing will collect is just a lie to the user.
    btns.forEach(b => b.disabled = !alive);
    if (!alive) dark();
  };

  btns.forEach(b => b.onclick = async () => {
    const label = b.textContent;
    b.disabled = true; b.textContent = 'Đã gửi';
    try { await jpost('/projects/' + encodeURIComponent(name) + '/command', {cmd: b.dataset.cmd}); }
    catch (e) { snack(e.message); }
    setTimeout(() => { b.textContent = label; status(); }, 700);
  });

  frame(); status();
  liveTimer = setInterval(frame, 400);
  liveStatusTimer = setInterval(status, 1500);
}

/* ---------------- lightbox ---------------- */
/* Full-size review of one shot: the strip's thumbnails are too small to judge
   focus or framing, which is the whole reason for looking at them. */
const lb = {
  el: document.getElementById('lightbox'),
  img: document.getElementById('lbImg'),
  name: document.getElementById('lbName'),
  count: document.getElementById('lbCount'),
  list: [], i: 0, base: '',
};

function showLightbox(list, i, base){
  lb.list = list; lb.base = base;
  lbGo(i);
  lb.el.classList.add('on');
}

function lbGo(i){
  if (!lb.list.length) return;
  lb.i = (i + lb.list.length) % lb.list.length;
  const n = lb.list[lb.i];
  lb.img.src = lb.base + encodeURIComponent(n);
  lb.name.textContent = n;
  lb.count.textContent = (lb.i + 1) + ' / ' + lb.list.length;
  lbReset();   // a new photo always starts fitted
}

/* Zoom and pan. These are 12 MP JPEGs drawn with object-fit:contain, so the
   biggest tap target on the screen is worth more as a magnifier than as a
   "next" button: one tap goes to 2.5x centred on the point that was tapped,
   the next tap comes back to fit. Paging lives on the arrows, the arrow keys
   and -- only at 1x, where it cannot fight the pan -- a sideways swipe. */
const LB_Z = 2.5;
const lbz = {on:false, x:0, y:0, px:0, py:0, ox:0, oy:0, down:false, moved:false};

function lbDraw(anim){
  lb.img.style.transition = anim ? 'transform .22s cubic-bezier(.2,0,0,1)' : 'none';
  lb.img.style.transform = `translate(${lbz.x}px, ${lbz.y}px) scale(${lbz.on ? LB_Z : 1})`;
}
/* Clamp against the untransformed layout box: at 2.5x the picture may be
   dragged by at most (scale-1)/2 of its own size before an edge would come
   inside the frame, which is what "cannot be dragged off screen" means. */
function lbClamp(){
  const mx = lb.img.offsetWidth  * (LB_Z - 1) / 2;
  const my = lb.img.offsetHeight * (LB_Z - 1) / 2;
  lbz.x = Math.max(-mx, Math.min(mx, lbz.x));
  lbz.y = Math.max(-my, Math.min(my, lbz.y));
}
function lbReset(){
  lbz.on = false; lbz.x = 0; lbz.y = 0; lbz.down = false;
  lb.el.classList.remove('zoom');
  lbDraw(false);
}
function lbZoom(on, cx, cy){
  lbz.on = !!on;
  if (lbz.on){
    // Still at 1x here, so the box is the layout box: move the tapped point
    // to the centre, then clamp it back inside.
    const r = lb.img.getBoundingClientRect();
    lbz.x = -(cx - (r.left + r.width  / 2)) * LB_Z;
    lbz.y = -(cy - (r.top  + r.height / 2)) * LB_Z;
    lbClamp();
  } else { lbz.x = 0; lbz.y = 0; }
  lb.el.classList.toggle('zoom', lbz.on);
  lbDraw(true);
}
const lbHide = () => { lb.el.classList.remove('on'); lbReset(); };

lb.img.addEventListener('pointerdown', e => {
  lbz.down = true; lbz.moved = false;
  lbz.px = e.clientX; lbz.py = e.clientY;
  lbz.ox = lbz.x; lbz.oy = lbz.y;
  try { lb.img.setPointerCapture(e.pointerId); } catch (err) {}
});
lb.img.addEventListener('pointermove', e => {
  if (!lbz.down) return;
  const dx = e.clientX - lbz.px, dy = e.clientY - lbz.py;
  if (!lbz.moved && Math.hypot(dx, dy) > 8) lbz.moved = true;
  if (!lbz.moved || !lbz.on) return;
  lbz.x = lbz.ox + dx; lbz.y = lbz.oy + dy;
  lbClamp(); lbDraw(false);
});
lb.img.addEventListener('pointerup', e => {
  if (!lbz.down) return;
  lbz.down = false;
  const dx = e.clientX - lbz.px, dy = e.clientY - lbz.py;
  if (!lbz.moved) return lbZoom(!lbz.on, e.clientX, e.clientY);
  if (!lbz.on && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5)
    lbGo(lb.i + (dx < 0 ? 1 : -1));
});
lb.img.addEventListener('pointercancel', () => { lbz.down = false; });
lb.img.addEventListener('dragstart', e => e.preventDefault());

document.getElementById('lbClose').onclick = lbHide;
document.getElementById('lbPrev').onclick = () => lbGo(lb.i - 1);
document.getElementById('lbNext').onclick = () => lbGo(lb.i + 1);
window.addEventListener('keydown', e => {
  if (!lb.el.classList.contains('on')) return;
  if (e.key === 'Escape') lbHide();
  if (e.key === 'ArrowLeft') lbGo(lb.i - 1);
  if (e.key === 'ArrowRight') lbGo(lb.i + 1);
});

/* ---------------- upload ---------------- */
function upload(name, files){
  if (!files || !files.length) return;
  const bar = document.getElementById('bar'), fill = bar.firstElementChild;
  bar.hidden = false;
  const fd = new FormData();
  for (const f of files) fd.append('files', f, f.name);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/projects/' + encodeURIComponent(name) + '/images');
  xhr.upload.onprogress = e => { if (e.lengthComputable) fill.style.width = (e.loaded/e.total*100)+'%'; };
  xhr.onload = () => {
    bar.hidden = true; fill.style.width = '0';
    if (xhr.status >= 400) return snack('Tải ảnh thất bại: ' + xhr.statusText);
    renderDetail(name);
  };
  xhr.onerror = () => { bar.hidden = true; snack('Mất kết nối khi tải ảnh.'); };
  xhr.send(fd);
}

/* ---------------- dialog ---------------- */
const dlg = document.getElementById('dlg');
function openDialog(){
  document.getElementById('dlgName').value = '';
  document.getElementById('dlgErr').textContent = '';
  dlg.showModal();
  setTimeout(() => document.getElementById('dlgName').focus(), 50);
}
document.getElementById('dlgCancel').onclick = () => dlg.close();
document.getElementById('dlgOk').onclick = async () => {
  const name = document.getElementById('dlgName').value.trim();
  try { await jpost('/projects', {name}); dlg.close(); go('detail', name); }
  catch (e) { document.getElementById('dlgErr').textContent = e.message; }
};
document.getElementById('dlgName').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('dlgOk').click();
});

/* ---------------- Material chrome ---------------- */
/* Snackbar. alert() froze the page to say "done"; this says the same thing
   without taking the tab hostage. confirm() stays where a real decision is
   being made -- stopping a running pipeline, deleting every photo. */
const snackEl = document.getElementById('snack');
const snackMsg = document.getElementById('snackMsg');
let snackTimer = null;
function snack(msg, ms){
  snackMsg.textContent = String(msg == null ? '' : msg).trim() || 'Xong';
  snackEl.classList.add('on');
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => snackEl.classList.remove('on'),
    ms || Math.min(9000, 3200 + snackMsg.textContent.length * 40));
}
document.getElementById('snackAct').onclick = () => {
  clearTimeout(snackTimer); snackEl.classList.remove('on');
};

/* Ripple. ONE delegated listener: the panels are rebuilt from innerHTML on
   every render, so a per-element listener would be re-added to fresh nodes
   several times a minute and the old ones would ride the detached tree.
   The span removes itself on animationend, so nothing outlives the press. */
const RIPPLE_ON = 'button, .tab, .card, .out .acts > *';
document.addEventListener('pointerdown', e => {
  if (e.button > 0 || !e.target.closest) return;
  const el = e.target.closest(RIPPLE_ON);
  if (!el || el.disabled) return;
  const r = el.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const d = 2 * Math.hypot(Math.max(e.clientX - r.left, r.right - e.clientX),
                           Math.max(e.clientY - r.top, r.bottom - e.clientY));
  const ink = document.createElement('span');
  ink.className = 'ripple';
  ink.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;`
                    + `top:${e.clientY - r.top - d / 2}px`;
  ink.addEventListener('animationend', () => ink.remove(), {once: true});
  if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
  el.appendChild(ink);
}, {passive: true});

/* The sticky bars leave the page only once there is something under them:
   a lighter container plus a real shadow, the same as the app's toolbar. */
let scrollQueued = false;
window.addEventListener('scroll', () => {
  if (scrollQueued) return;
  scrollQueued = true;
  requestAnimationFrame(() => {
    scrollQueued = false;
    document.body.classList.toggle('scrolled', window.scrollY > 4);
  });
}, {passive: true});

/* One indicator element slides between tabs instead of each tab carrying its
   own bottom border. It is measured, never guessed: the labels are Vietnamese
   and their widths only settle once the webfont has loaded. */
function syncTabIndicator(){
  const bar = app.querySelector('.tabs');
  if (!bar) return;
  const ind = bar.querySelector('.tabind'), on = bar.querySelector('[data-tab].on');
  if (!ind || !on) return;
  ind.style.width = on.offsetWidth + 'px';
  ind.style.transform = `translateX(${on.offsetLeft}px)`;
  // Only animate from the second placement on, or it flies in from x=0.
  if (!bar.classList.contains('ready')) requestAnimationFrame(() => bar.classList.add('ready'));
}
// Bubbled, so it runs after the tab's own handler has moved `.on`. Nothing
// here reaches into setTab or any poller; it only measures what they left.
document.addEventListener('click', e => {
  if (e.target.closest && e.target.closest('.tabs [data-tab]')) syncTabIndicator();
});
window.addEventListener('resize', syncTabIndicator);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncTabIndicator);

/* Bottom navigation, narrow screens only. Two destinations because two is
   what this front end has: the project list, and the project you have open. */
const bnav = document.getElementById('bnav');
function syncChrome(){
  const detail = view.page === 'detail';
  document.body.classList.toggle('has-detail', detail);
  bnav.querySelectorAll('[data-nav]').forEach(b =>
    b.classList.toggle('on', b.dataset.nav === (detail ? 'detail' : 'list')));
  syncTabIndicator();
}
bnav.addEventListener('click', e => {
  const b = e.target.closest('[data-nav]');
  if (!b) return;
  if (b.dataset.nav === 'list' && view.page !== 'list') return go('list');
  window.scrollTo({top: 0, behavior: 'smooth'});
});
// Both renderers replace #app wholesale; watching that is how the chrome stays
// in step without any renderer having to call back into it.
new MutationObserver(syncChrome).observe(app, {childList: true});
syncChrome();

/* ---------------- routing ---------------- */
function go(page, name){
  clearInterval(poller);
  stopLive();
  stopTune();
  view = {page, name};
  location.hash = page === 'detail' ? '#/' + encodeURIComponent(name) : '';
  render();
}
function render(){
  (view.page === 'detail' ? renderDetail(view.name) : renderList())
    .catch(e => { app.innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
}
window.addEventListener('hashchange', () => {
  clearInterval(poller);
  stopLive();
  stopTune();
  const h = location.hash.replace(/^#\/?/, '');
  view = h ? {page:'detail', name:decodeURIComponent(h)} : {page:'list', name:null};
  render();
});
const h0 = location.hash.replace(/^#\/?/, '');
if (h0) view = {page:'detail', name:decodeURIComponent(h0)};
render();
</script>
</body>
